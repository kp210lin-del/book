<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>寄せの手筋200</title>
<style>
:root{
  --bg:#1f2430; --panel:#2a3140; --line:#3a4150; --ink:#eef2f7;
  --sub:#9aa7bd; --accent:#e0853a; --ok:#46b46b; --bad:#d9534f;
  --board:#e8c479; --grid:#7a5a22;
  --left-col:clamp(360px, 40vw, 520px);
  --tool-col:112px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
a{color:inherit;text-decoration:none}

/* ビューアは1画面固定（全体スクロールさせない。長い解答は左カラム内でスクロール） */
body{overflow:hidden}
/* 左カラム上部のメタ情報（盤とは分離して左に寄せる） */
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px;
  padding-bottom:8px;border-bottom:1px solid #333}
.meta .back{font-size:15px;padding:8px 12px;border-radius:10px;background:#2a3140}
.meta .bktitle{font-size:19px;font-weight:700}
.meta .counter{font-size:15px;color:var(--sub);white-space:nowrap}
.meta .counter b{color:var(--ink);font-size:20px}
.meta .turn{font-size:15px;color:var(--sub)}
.meta .turn b{color:var(--accent)}
.wrap{display:flex;gap:14px;padding:10px 12px;align-items:stretch;max-width:1480px;margin:0 auto;
  height:100dvh;max-height:100dvh;overflow:hidden}
.left{flex:0 0 var(--left-col);min-width:0;height:100%;padding-right:2px;display:flex;flex-direction:column;min-height:0}
.left-main .answer{width:100%;max-width:calc(var(--bw) * 0.7)}
.left-main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.right{flex:1 1 auto;min-width:0;display:flex;align-items:stretch;justify-content:center}
.boardbox{display:grid;grid-template-rows:auto minmax(0,1fr) auto;align-content:center;gap:10px;
  width:100%;max-width:580px;margin:0 auto}
.boardrow{display:grid;grid-template-columns:minmax(0,1fr) var(--tool-col);align-items:start;column-gap:10px;width:100%}
#boardHost{min-width:0;justify-self:center;position:relative}
.boardtools{display:flex;flex-direction:column;gap:10px;width:100%}
.modegroup{display:flex;flex-direction:column;gap:8px}
.toolbtn{width:100%;padding:10px 8px;border-radius:10px;border:1px solid #000;
  background:#39414f;color:var(--ink);font-size:15px;font-weight:700;min-height:44px}
.toolbtn.showbtn{background:var(--accent);color:#1b1b1b;font-size:18px;min-height:52px}
.toolbtn.active{background:var(--accent);color:#1b1b1b}
.toolbtn:disabled{opacity:.45;cursor:default}
.promobox{display:none !important;flex-direction:column;gap:8px}
.promobox.show{display:none !important}
.promobtn{width:100%;padding:10px 8px;border-radius:10px;border:1px solid #000;
  background:#5d6a82;color:var(--ink);font-size:15px;font-weight:700;min-height:44px}
.toolstatus{width:100%;background:var(--panel);border:1px solid #000;border-radius:10px;
  padding:10px;font-size:12px;line-height:1.6;color:var(--sub);min-height:112px}
.turn{font-size:16px;color:var(--sub)}
.turn b{color:var(--accent)}
.brd-wrap{position:relative;width:max-content;max-width:100%;margin:0 auto}
table.board{border-collapse:collapse;background:var(--board);
  box-shadow:0 6px 20px rgba(0,0,0,.45);border:3px solid var(--grid)}
table.board td{width:var(--cell);height:var(--cell);border:1px solid var(--grid);
  text-align:center;vertical-align:middle;padding:0;
  font-size:calc(var(--cell)*.72);line-height:1;font-weight:600;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
table.board.editable td{cursor:pointer}
table.board td.sel{background:rgba(224,133,58,.28)}
table.board td.dst{box-shadow:inset 0 0 0 3px rgba(70,180,107,.8)}
td.g span{display:inline-block;transform:rotate(180deg)}
td.s{color:#16407a} td.g{color:#a32a2a}  /* 自陣(先手)=青 / 敵(後手)=赤 で視認性UP */
/* 座標は盤の外（上=筋9..1 / 右=段一..九） */
.brd{display:inline-block}
.files{display:flex;padding-left:3px}
.files i{width:var(--cell);text-align:center;font-style:normal;font-weight:700;
  font-size:calc(var(--cell)*.23);color:var(--sub);font-family:sans-serif;padding-bottom:3px}
.promo-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(17,20,28,.34);backdrop-filter:blur(2px);border-radius:12px;z-index:8}
.promo-card{min-width:min(86vw, 280px);max-width:min(86vw, 320px);padding:16px 14px 14px;
  border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(35,41,57,.96);
  box-shadow:0 18px 36px rgba(0,0,0,.35);text-align:center}
.promo-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:10px}
.promo-sub{font-size:14px;color:var(--sub);margin-bottom:14px}
.promo-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.promo-choice{padding:12px 10px;border-radius:12px;border:1px solid #000;background:#39414f;
  color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.promo-choice.primary{background:var(--accent);color:#1b1b1b}
.promo-choice:active{filter:brightness(.94)}
.bmid{display:flex;align-items:flex-start}
.ranks{display:flex;flex-direction:column;padding-top:3px}
.ranks i{height:var(--cell);display:flex;align-items:center;justify-content:center;
  width:calc(var(--cell)*.62);font-style:normal;font-weight:700;
  font-size:calc(var(--cell)*.23);color:var(--sub);font-family:sans-serif}
.hands{display:flex;flex-direction:column;gap:4px;width:100%;max-width:none}
.hand{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;
  background:var(--panel);border:1px solid #000;border-radius:10px;padding:10px 12px;font-size:17px;min-height:68px}
.hand .lab{display:none}
.hand .pc{display:grid;grid-template-columns:repeat(auto-fit, minmax(64px, 68px));gap:8px;
  align-content:start;justify-content:start;font-family:"Hiragino Mincho ProN",serif;min-width:0}
.handbtn{width:100%;min-width:0;min-height:48px;padding:6px 8px;border-radius:10px;border:1px solid #000;
  background:#485164;color:var(--ink);font-size:24px;line-height:1;font-family:"Hiragino Mincho ProN",serif;
  display:flex;align-items:center;justify-content:center;gap:4px}
.handbtn small{font-size:14px;line-height:1}
.handbtn.g span{display:inline-block;transform:rotate(180deg)}
.handbtn.sel{background:var(--accent);color:#1b1b1b}
.handempty{grid-column:1/-1;font-size:15px;color:var(--sub);padding-top:10px}
.qmeta{font-size:13px;color:var(--sub);margin-bottom:4px}
.btnrow{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
button.big{flex:1 1 auto;font-size:18px;font-weight:700;padding:12px;border-radius:12px;
  border:none;background:var(--accent);color:#1b1b1b;min-height:48px}
button.nav{background:#39414f;color:var(--ink)}
button.big:active{filter:brightness(.9)}
.answer{display:none;background:var(--panel);border:1px solid #000;border-radius:12px;
  padding:14px;font-size:17px;line-height:1.6;width:100%;max-width:none;margin:0}
.answer.show{display:block}
.ans-h{font-size:14px;color:var(--sub);margin-bottom:8px}
.movebig{font-size:30px;font-weight:800;color:var(--accent);font-family:"Hiragino Mincho ProN",serif}
.expl{font-size:17px;line-height:1.85;margin-top:10px;white-space:pre-wrap;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.captured{margin-top:10px;font-size:14px;color:var(--sub)}
.ansimg{width:min(100%, calc(var(--bw) * 0.6667));max-width:min(100%, calc(var(--bw) * 0.6667));border-radius:10px;border:1px solid #000;background:#fff;display:block;margin:0 auto;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.pending{margin-top:8px;font-size:13px;color:var(--sub)}
.choice{border:1px solid #3a4150;border-radius:10px;padding:10px 12px;margin:8px 0}
.choice.correct{border-color:var(--ok);background:rgba(70,180,107,.12)}
.choice .mv{font-size:20px;font-weight:700}
.choice .tag{float:right;font-size:13px;padding:2px 8px;border-radius:20px;background:#39414f}
.choice.correct .tag{background:var(--ok);color:#08240f}
.choice .ex{margin-top:6px;font-size:15px;color:#d4dbe8}
.seq{font-size:19px;line-height:1.9;font-family:"Hiragino Mincho ProN",serif}
.seq .ply{display:inline-block;padding:2px 8px;margin:2px;border-radius:8px;background:#39414f}
.seq .hisshi{background:var(--bad);color:#fff;font-weight:700}
.wrongseq{margin-top:10px;font-size:16px;color:var(--sub)}
.note{margin-top:10px;font-size:13px;color:var(--sub)}
.kind{display:inline-block;font-size:13px;padding:3px 10px;border-radius:20px;
  background:var(--accent);color:#1b1b1b;font-weight:700;margin-bottom:8px}
.jump{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px;color:var(--sub)}
#jumpLegacy{display:none}
.jump-label{font-size:13px;font-weight:600;color:var(--sub)}
.jump input{width:80px;font-size:18px;padding:10px 8px;border-radius:10px;border:1px solid #000;
  background:#2a3140;color:var(--ink);text-align:center}
.jumpbtn{padding:10px 8px;border-radius:10px;border:1px solid #000;background:#39414f;color:var(--ink);
  font-size:15px;font-weight:700;min-height:44px}
.jump.tooljump{display:grid;grid-auto-flow:row;gap:8px;align-items:stretch;margin-top:0;font-size:13px}
.jump.tooljump input,.jump.tooljump button{width:100%}
.tool-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.problem-nav{display:flex;flex-direction:column;gap:6px}
.problem-nav .toolbtn{min-height:34px;padding:7px 8px;font-size:13px;font-weight:600}
.navrow-fixed,.situation,.toolstatus{display:none !important}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:stretch;gap:6px}
  .right{order:1;width:100%;flex:0 0 auto}
  .left{order:2;width:100%;flex:1 1 auto;min-height:0;height:auto;overflow-y:auto}
  .boardbox{width:100%}
  .boardrow{grid-template-columns:minmax(0,1fr) 96px;column-gap:8px}
  .toolbtn{font-size:14px;min-height:40px;padding:8px 6px}
  .toolstatus{min-height:96px;padding:8px}
  .hand{grid-template-columns:minmax(0,1fr);padding:8px 10px;min-height:60px}
  .hand .pc{grid-template-columns:repeat(auto-fit, minmax(54px, 60px));gap:6px}
  .handbtn{min-height:42px;font-size:22px}
  .answer{max-width:100%}
  .ansimg{width:min(100%, 96vw);max-width:min(100%, 96vw)}
  .promo-card{min-width:min(74vw, 250px);padding:14px 12px 12px}
  .promo-title{font-size:17px}
  .promo-choice{font-size:16px}
}
@media (min-width:821px){
  .wrap{gap:14px;padding-inline:12px}
  .boardtools{align-self:center}
}
@media (min-width:821px) and (max-width:1180px) and (orientation:landscape){
  :root{
    --left-col:clamp(340px, 38vw, 500px);
    --tool-col:108px;
  }
  .wrap{gap:12px;padding-inline:10px}
  .boardbox{gap:8px}
  .hand{padding:9px 10px;min-height:64px}
  .hand .pc{grid-template-columns:repeat(auto-fit, minmax(60px, 64px))}
}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="left-main">
    <div class="meta">
      <a class="back" href="index.html">☰ 一覧</a>
      <div class="bktitle">寄せの手筋200</div>
      <div class="counter">第 <b id="curNo">1</b> 問 / <span id="total">0</span></div>
      <div class="turn" id="turnLbl"></div>
    </div>
    <div class="qmeta" id="qmeta"></div>
    <div class="answer" id="answer"></div>
    </div>
    <div class="jump">問題番号へ <input type="number" id="jumpInp" min="1">
      <button class="nav" style="padding:8px 14px;border-radius:8px;border:none;color:#fff" id="jumpBtn">移動</button></div>
  </div>
  <div class="right"><div class="boardbox">
    <div class="hands"><div class="hand"><span class="lab">後手 持駒</span><span class="pc" id="goteHandPc">なし</span></div></div>
    <div class="boardrow">
      <div id="boardHost"></div>
      <div class="boardtools">
        
        <button class="toolbtn" id="resetBtn">初期配置</button>
        <button class="toolbtn" id="copySfenBtn">SFENコピー</button>
        <div class="promobox" id="promoBox">
          <button class="promobtn" id="promoteBtn">成る</button>
          <button class="promobtn" id="stayBtn">成らず</button>
        </div>
        <div class="toolstatus" id="toolStatus">盤の横ボタンで移動モードにします。</div>
        <div class="tool-actions">
          <button class="toolbtn showbtn" id="showBtn">解答を見る</button>
          <div class="problem-nav">
            <button class="toolbtn nav" id="prevBtn">◀ 前の問題</button>
            <button class="toolbtn nav" id="nextBtn">次の問題 ▶</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hands"><div class="hand"><span class="lab">先手 持駒</span><span class="pc" id="senteHandPc">なし</span></div></div>
  </div></div>
</div>

function parseSfen(sfen){
  const [board,turn,hand]=sfen.split(" ");
  const grid=[];
  for(const row of board.split("/")){
    const cells=[];let promoted=false;
    for(const ch of row){
      if(ch==="+"){promoted=true;continue;}
      if(/[0-9]/.test(ch)){for(let i=0;i<+ch;i++)cells.push(null);}
      else{cells.push((promoted?"+":"")+ch);promoted=false;}
    }
    grid.push(cells);
  }
  const hands={s:{},g:{}};
  if(hand&&hand!=="-"){
    let n="";
    for(const ch of hand){
      if(/[0-9]/.test(ch)){n+=ch;continue;}
      const cnt=n?+n:1;n="";
      const up=ch.toUpperCase();
      const side=ch===up?"s":"g";
      hands[side][up]=(hands[side][up]||0)+cnt;
    }
  }
  return {grid,turn,hands};
}
function cloneBoardState(s){return {grid:s.grid.map(r=>r.slice()),hands:{s:{...s.hands.s},g:{...s.hands.g}},turn:s.turn};}
function cloneState(sfen){const s=parseSfen(sfen);return cloneBoardState(s);}
function boardToSfen(grid){
  return grid.map(row=>{
    let out="",empty=0;
    for(const cell of row){
      if(!cell){empty++;continue;}
      if(empty){out+=String(empty);empty=0;}
      out+=cell;
    }
    if(empty)out+=String(empty);
    return out;
  }).join("/");
}
function handsToSfen(hands){
  let out="";
  for(const p of HAND_ORDER){
    const s=hands.s[p]||0,g=hands.g[p]||0;
    if(s)out+=(s>1?String(s):"")+p;
    if(g)out+=(g>1?String(g):"")+p.toLowerCase();
  }
  return out||"-";
}
function stateToSfen(state){return boardToSfen(state.grid)+" "+state.turn+" "+handsToSfen(state.hands)+" 1";}
function sqToRC(sq){const file=+sq[0],rank=RANK_L.indexOf(sq[1]);return {r:rank,c:9-file,file};}
function rcToSq(r,c){return String(9-c)+RANK_L[r];}
function rcToLabel(r,c){return ZEN_NUM[9-c]+KAN_NUM[r+1];}
function sideOf(cell){return cell===cell.toLowerCase()?"g":"s";}
function sideToMove(state){return state.turn==="b"?"s":"g";}
function basePieceOf(cell){return cell.replace("+","").toUpperCase();}
function isPromoted(cell){return cell&&cell[0]==="+";}

function renderHand(side,h){
  let html="";
  for(const p of HAND_ORDER){
    const n=h[p]||0;
    if(!n)continue;
    const sel=selected&&selected.kind==="hand"&&selected.side===side&&selected.piece===p?" sel":"";
    html+=`<button class="handbtn ${side==='g'?'g':'s'}${sel}" data-hand-side="${side}" data-hand-piece="${p}"><span>${PIECE_JP[p]}</span><small>${n}</small></button>`;
  }
  return html||'<div class="handempty">なし</div>';
}

function renderPromotionOverlay(){
  if(!pendingPromotion||!currentState)return "";
  const mover=currentState.grid[pendingPromotion.from.r][pendingPromotion.from.c];
  const piece=PIECE_JP[(mover&&mover[0]==="+"?"+":"")+basePieceOf(mover||"P")]||"駒";
  return `<div class="promo-overlay" id="promoOverlay" aria-live="polite">

  for(let f=9;f>=1;f--)files+=`<i>${f}</i>`;

  let tbl='<table class="board editable">';

      const dst=selected&&moveTarget&&moveTarget.r===r&&moveTarget.c===f?' dst':'';
      if(!p){tbl+=`<td data-r="${r}" data-c="${f}" class="${sel}${dst}"></td>`;continue;}
      const up=p.replace("+","").toUpperCase();
      const base=(p[0]==="+"?"+":"")+up;
      const isGote=p.replace("+","")===p.replace("+","").toLowerCase();
      tbl+=`<td data-r="${r}" data-c="${f}" class="${isGote?'g':'s'}${sel}${dst}"><span>${PIECE_JP[base]||"?"}</span></td>`;
    }
    tbl+='</tr>';
  }
  tbl+='</table>';
  let ranks='<div class="ranks">';

  host.querySelectorAll("[data-promo-choice]").forEach(btn=>btn.addEventListener("click",onPromotionChoice));
  document.querySelectorAll("[data-hand-side]").forEach(btn=>btn.addEventListener("click",onHandClick));
}

function usiToJp(state,usi,prevDest){
  const black=state.turn==="b",mark=black?"▲":"△";
  let dest,jp,isDrop=usi.includes("*"),promote=usi.endsWith("+");
  if(isDrop){
    const piece=usi[0];
    dest=usi.slice(2,4).replace("+","");
    const d=sqToRC(dest);
    jp=mark+ZEN_NUM[d.file]+KAN_NUM[d.r+1]+PIECE_JP[piece]+"打";
    state.grid[d.r][d.c]=black?piece:piece.toLowerCase();
    state.hands[black?"s":"g"][piece]--;
  }else{
    const from=usi.slice(0,2),to=usi.slice(2,4);
    const f=sqToRC(from),t=sqToRC(to);
    let mover=state.grid[f.r][f.c]||"P";
    const baseUp=mover.replace("+","").toUpperCase();
    const isSame=prevDest&&prevDest===to;
    const pieceName=(mover[0]==="+")?PIECE_JP["+"+baseUp]:PIECE_JP[baseUp];
    const sq=isSame?"同":ZEN_NUM[t.file]+KAN_NUM[t.r+1];
    jp=mark+sq+pieceName+(promote?"成":"");
    const cap=state.grid[t.r][t.c];
    if(cap){
      const cu=cap.replace("+","").toUpperCase();
      state.hands[black?"s":"g"][cu]=(state.hands[black?"s":"g"][cu]||0)+1;
    }
    let np=mover;
    if(promote)np=(mover[0]==="+"?mover:"+"+mover);
    state.grid[t.r][t.c]=np;
    state.grid[f.r][f.c]=null;
  }
  state.turn=black?"w":"b";
  return {jp,dest:usi.slice(2,4).replace("+","")};
}
function renderSeq(sfen,moves){
  const st=cloneState(sfen);let prev=null;const out=[];
  for(const m of moves){const r=usiToJp(st,m,prev);out.push(r.jp);prev=r.dest;}
  return out;
}

const POSKEY="shogibook_pos_"+BOOK_SLUG;

function currentProblem(){return DATA[curIdx];}
function currentAnswer(){return currentProblem().answer||null;}
function currentAnswerUsi(){return (currentAnswer()&&currentAnswer().usi)||"";}
function hasModeToggle(){return !!document.getElementById("modeGroup");}
function supportsAutoJudge(p=currentProblem()){
  return !!(hasModeToggle()&&p&&p.answer&&p.answer.type==="next_move"&&p.answer.usi);
}
function effectiveMode(p=currentProblem()){
  if(!hasModeToggle())return "review";
  if(playMode==="review")return "review";

  ansBtn.disabled=!judgeable;

  clearSelection();
  renderBoard(document.getElementById("boardHost"),currentState);
  syncBoardTools(msg);
}
function inPromotionZone(side,row){return side==="s"?row<=2:row>=6;}
function canPromoteMove(mover,from,to){
  if(!mover||isPromoted(mover))return false;
  const base=basePieceOf(mover);
  if(!PROMOTABLE[base])return false;
  const side=sideOf(mover);
  return inPromotionZone(side,from.r)||inPromotionZone(side,to.r);
}
function mustPromoteMove(mover,to){
  const base=basePieceOf(mover),side=sideOf(mover);
  if(side==="s"){
    if((base==="P"||base==="L")&&to.r===0)return true;
    if(base==="N"&&to.r<=1)return true;
  }else{
    if((base==="P"||base==="L")&&to.r===8)return true;
    if(base==="N"&&to.r>=7)return true;
  }
  return false;
}
function buildMoveUsi(from,to,promote){return rcToSq(from.r,from.c)+rcToSq(to.r,to.c)+(promote?"+":"");}
function buildDropUsi(sel,to){return sel.piece+"*"+rcToSq(to.r,to.c);}
function playCorrectChime(){
  try{
    const ctx=getMoveAudioContext(true);
    if(!ctx)return;
    const now=ctx.currentTime;
    [784,1046].forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type="triangle";
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,now+i*0.16);
      gain.gain.exponentialRampToValueAtTime(0.12,now+i*0.16+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+i*0.16+0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now+i*0.16);
      osc.stop(now+i*0.16+0.16);
    });
  }catch(e){}
}
function getMoveAudioContext(forceResume){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return null;
  if(!moveAudioCtx)moveAudioCtx=new Ctx();
  if(forceResume&&moveAudioCtx.state==="suspended")moveAudioCtx.resume().catch(()=>{});
  return moveAudioCtx;
}
function playMoveClick(){
  try{
    const ctx=getMoveAudioContext(true);
    if(!ctx)return;
    const now=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="triangle";
    osc.frequency.setValueAtTime(420,now);
    osc.frequency.exponentialRampToValueAtTime(250,now+0.055);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.09,now+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.07);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now+0.075);
  }catch(e){}
}
function syncBoardTools(msg){
  const stat=document.getElementById("toolStatus");
  const mode=effectiveMode();
  syncModeButtons();
  setPromotionBox(false);
  if(msg){stat.innerHTML=msg;return;}
  if(hasModeToggle()&&playMode==="answer"&&!supportsAutoJudge()){
    stat.innerHTML="この問題は正解判定が未整備です。<br>検討モードで盤面を動かせます。";
    return;
  }
  if(mode==="answer"&&answerSolved){
    stat.innerHTML="正解です。<br>解答を表示しました。";
    return;
  }
  if(pendingPromotion){
    stat.innerHTML=mode==="answer"?"盤上の 成る / 成らず を選ぶと判定します。":"盤上オーバーレイで 成る / 成らず を選んでください。";
    return;
  }
  if(selected){
    if(selected.kind==="hand"){
      stat.innerHTML=mode==="answer"
        ?"打つマスを選んでください。<br>正解なら自動で解答を開きます。"
        :`${selected.side==="s"?"先手":"後手"}の持ち駒 ${PIECE_JP[selected.piece]} を選択中<br>置きたいマスをタップしてください。`;
      return;
    }
    const p=currentState.grid[selected.r][selected.c]||"";
    const piece=PIECE_JP[(p[0]==="+"?"+":"")+p.replace("+","").toUpperCase()]||"駒";
    stat.innerHTML=mode==="answer"
      ?`${piece} を選択中<br>行き先をタップすると正解判定します。`
      :`${piece} を選択中<br>${rcToLabel(selected.r,selected.c)} から動かす先をタップしてください。`;
    return;
  }
  stat.innerHTML=mode==="answer"
    ?"解答モードです。<br>正解手を指すと音を鳴らして解答を表示します。"
    :"検討モードです。<br>駒を自由に動かして盤面を検討できます。";
}
async function copyCurrentSfen(){
  const sfen=stateToSfen(currentState);
  try{
    await navigator.clipboard.writeText(sfen);
    syncBoardTools("SFEN をコピーしました。<br>そのまま貼り付けできます。");
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=sfen;document.body.appendChild(ta);ta.select();
    try{
      document.execCommand("copy");
      syncBoardTools("SFEN をコピーしました。<br>そのまま貼り付けできます。");
    }catch(_e){
      syncBoardTools("コピーに失敗しました。<br>ブラウザの権限を確認してください。");
    }
    ta.remove();
  }
}
function commitCorrect(commit){
  answerSolved=true;
  commit();
  playCorrectChime();
  showAnswer(true);
}
function judgeAttempt(usi,commit){
  if(effectiveMode()!=="answer")return false;
  if(usi===currentAnswerUsi()){
    commitCorrect(commit);
  }else{
    clearSelection();
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools("違います。<br>もう一度どうぞ。");
  }
  return true;
}
function applyBoardMove(from,to,promote,msg){
  const mover=currentState.grid[from.r][from.c];
  if(!mover)return;
  const target=currentState.grid[to.r][to.c];
  if(target&&((target===target.toLowerCase())===(mover===mover.toLowerCase()))){
    selected={kind:"board",r:to.r,c:to.c};
    moveTarget=null;
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools();
    return;
  }
  if(target){
    const up=target.replace("+","").toUpperCase();
    const side=mover===mover.toLowerCase()?"g":"s";
    currentState.hands[side][up]=(currentState.hands[side][up]||0)+1;
  }
  const placed=(promote&&!isPromoted(mover))?("+"+mover):mover;
  currentState.grid[to.r][to.c]=placed;
  currentState.grid[from.r][from.c]=null;
  currentState.turn=(mover===mover.toLowerCase())?"b":"w";
  clearSelection();
  playMoveClick();
  renderBoard(document.getElementById("boardHost"),currentState);
  syncBoardTools(msg||(promote?"成りました。<br>続けて盤面を動かせます。":"動かしました。<br>続けて盤面を動かせます。"));
}
function dropHandPiece(sel,to,msg){
  if(currentState.grid[to.r][to.c]){
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools("そのマスには駒があります。<br>空きマスを選んでください。");
    return;
  }
  const count=currentState.hands[sel.side][sel.piece]||0;
  if(count<=0){
    clearSelection();
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools("その持ち駒はもうありません。");
    return;
  }
  currentState.hands[sel.side][sel.piece]=count-1;
  if(!currentState.hands[sel.side][sel.piece])delete currentState.hands[sel.side][sel.piece];
  currentState.grid[to.r][to.c]=sel.side==="s"?sel.piece:sel.piece.toLowerCase();
  currentState.turn=sel.side==="s"?"w":"b";
  clearSelection();
  playMoveClick();
  renderBoard(document.getElementById("boardHost"),currentState);
  syncBoardTools(msg||"持ち駒を置きました。<br>続けて盤面を動かせます。");
}
function movePiece(from,to){
  const mover=currentState.grid[from.r][from.c];
  if(!mover)return;
  if(canPromoteMove(mover,from,to)){
    if(mustPromoteMove(mover,to)){
      if(judgeAttempt(buildMoveUsi(from,to,true),()=>applyBoardMove(from,to,true,"正解です。<br>解答を表示しました。")))return;
      applyBoardMove(from,to,true);
      return;
    }
    pendingPromotion={from:{...from},to:{...to}};
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools();
    return;
  }
  if(judgeAttempt(buildMoveUsi(from,to,false),()=>applyBoardMove(from,to,false,"正解です。<br>解答を表示しました。")))return;
  applyBoardMove(from,to,false);
}
function resolvePromotion(promote){
  if(!pendingPromotion)return;
  const mv=pendingPromotion;
  const usi=buildMoveUsi(mv.from,mv.to,promote);
  if(judgeAttempt(usi,()=>applyBoardMove(mv.from,mv.to,promote,"正解です。<br>解答を表示しました。")))return;
  applyBoardMove(mv.from,mv.to,promote);
}
function onPromotionChoice(e){
  const choice=e.currentTarget.dataset.promoChoice;
  resolvePromotion(choice==="promote");
}
function onHandClick(e){
  if(pendingPromotion){syncBoardTools("先に盤上の 成る / 成らず を選んでください。");return;}
  if(effectiveMode()==="answer"&&answerSolved){syncBoardTools("正解済みです。<br>次の問題へ進むか初期配置に戻してください。");return;}
  const btn=e.currentTarget;
  const side=btn.dataset.handSide,piece=btn.dataset.handPiece;
  if(effectiveMode()==="answer"&&side!==sideToMove(currentState)){
    syncBoardTools("手番側の持ち駒を選んでください。");
    return;
  }
  if(selected&&selected.kind==="hand"&&selected.side===side&&selected.piece===piece){
    clearSelection();
  }else{
    selected={kind:"hand",side,piece};
    moveTarget=null;
  }
  renderBoard(document.getElementById("boardHost"),currentState);
  syncBoardTools();
}
function onBoardCellClick(e){
  if(pendingPromotion){syncBoardTools("先に盤上の 成る / 成らず を選んでください。");return;}
  if(effectiveMode()==="answer"&&answerSolved){syncBoardTools("正解済みです。<br>次の問題へ進むか初期配置に戻してください。");return;}
  const td=e.currentTarget;
  const r=+td.dataset.r,c=+td.dataset.c;
  const p=currentState.grid[r][c];
  if(selected&&selected.kind==="hand"){
    moveTarget={r,c};
    if(judgeAttempt(buildDropUsi(selected,{r,c}),()=>dropHandPiece(selected,{r,c},"正解です。<br>解答を表示しました。")))return;
    dropHandPiece(selected,{r,c});
    return;
  }
  if(!selected){
    if(!p){syncBoardTools("空きマスです。<br>動かしたい駒を選んでください。");return;}
    if(effectiveMode()==="answer"&&sideOf(p)!==sideToMove(currentState)){
      syncBoardTools("手番側の駒を選んでください。");
      return;
    }
    selected={kind:"board",r,c};
    moveTarget=null;
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools();
    return;
  }
  if(selected.kind==="board"&&selected.r===r&&selected.c===c){
    clearSelection();
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools();
    return;
  }
  moveTarget={r,c};
  if(selected.kind==="board"&&p&&((p===p.toLowerCase())===(currentState.grid[selected.r][selected.c]===currentState.grid[selected.r][selected.c].toLowerCase()))){
    selected={kind:"board",r,c};
    moveTarget=null;
    renderBoard(document.getElementById("boardHost"),currentState);
    syncBoardTools();
    return;
  }
  if(selected.kind==="board")movePiece(selected,{r,c});
}
function buildAnswer(p,a){
  if(a&&a.image_ans){
    let s="<div class='ans-h'>本の解答ページ</div>";
    if(a.type==="next_move"){
      const jp=a.usi ? renderSeq(p.sfen,[a.usi])[0] : (a.move_jp||"");
      if(jp)s+="<div class='movebig'>"+esc(jp)+"</div>";
      if(a.percent!=null)s+="<div class='note'>正解率 "+esc(String(a.percent))+"%</div>";
      if(a.title)s+="<div class='captured'>"+esc(a.title)+"</div>";
    }
    s+="<img class='ansimg' src='"+a.image_ans+"' loading='lazy' alt='解答画像'>";
    if(a.incomplete)s+="<div class='pending'>一部の解答情報は補完中です。</div>";
    return s;
  }
  return _answerBody(p,a);
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function _answerBody(p,a){
  if(!a)return "<div class='ans-h'>解答データなし</div>";
  if(a.type==="final_move"){
    if(a.explanation){
      let s="<div class='ans-h'>解答</div>";
      if(a.title)s+="<div class='movebig'>"+esc(a.title)+"</div>";
      s+="<div class='expl'>"+esc(a.explanation)+"</div>";
      if(a.captured)s+="<div class='captured'>持ち駒　"+esc(a.captured)+"</div>";
      return s;
    }
    let s="<div class='ans-h'>解答</div>";
    s+="<div class='movebig'>"+esc(a.move_jp)+" まで</div>";
    if(a.incomplete)s+="<div class='note'>表記は一部省略しています。</div>";
    return s;
  }
  if(a.type==="single"){
    const jp=renderSeq(p.sfen,[a.usi])[0];
    return "<div class='ans-h'>正解</div><div class='movebig'>"+jp+"</div>";
  }
  if(a.type==="next_move"){
    const jp=a.usi ? renderSeq(p.sfen,[a.usi])[0] : (a.move_jp||"");
    let s="<div class='ans-h'>正解</div>";
    s+="<div class='movebig'>"+esc(jp||a.move_jp||"")+"</div>";
    if(a.percent!=null)s+="<div class='note'>正解率 "+esc(String(a.percent))+"%</div>";
    if(a.title)s+="<div class='captured'>"+esc(a.title)+"</div>";
    if(a.explanation)s+="<div class='expl'>"+esc(a.explanation)+"</div>";
    if(a.incomplete)s+="<div class='note'>一部の解答情報は補完中です。</div>";
    return s;
  }
  if(a.type==="choice"){
    let s="<div class='ans-h'>選択肢</div>";
    for(const c of a.choices){
      const ok=c.label===a.correct;
      s+="<div class='choice"+(ok?" correct":"")+"'><span class='tag'>"+c.label+(ok?" 正解":"")+"</span>";
      s+="<div class='mv'>"+c.move_jp+"</div>";
      if(c.explanation)s+="<div class='ex'>"+c.explanation+"</div>";
      s+="</div>";
    }
    return s;
  }
  if(a.type==="sequence"){
    let s="";
    if(a.kind)s+="<span class='kind'>"+a.kind+"</span>";
    s+="<div class='ans-h'>正解手順</div>";
    (a.sequences||[]).forEach((seq,si)=>{
      const jps=renderSeq(p.sfen,seq);
      const hi=(a.hisshi_index||[])[si];
      s+="<div class='seq'>";
      jps.forEach((mv,k)=>{
        const isH=(hi!==undefined&&k===hi);
        s+="<span class='ply"+(isH?" hisshi":"")+"'>"+(k+1)+". "+mv+"</span>";
      });
      s+="</div>";
    });
    if(a.wrong_sequences&&a.wrong_sequences.length){
      s+="<div class='wrongseq'><div class='ans-h'>誤答例</div>";
      a.wrong_sequences.forEach(seq=>{
        const jps=renderSeq(p.sfen,seq);
        s+="<div class='seq' style='opacity:.75'>"+jps.map((m,i)=>"<span class='ply'>"+(i+1)+". "+m+"</span>").join("")+"</div>";
      });
      s+="</div>";
    }
    return s;
  }
  return "<div class='ans-h'>未対応の解答形式です</div>";
}
function answerImageSrc(p,a){
  if(a&&a.image_ans)return a.image_ans;
  if(!p||p.problem_no==null)return "";
  return "yose_img/"+String(p.problem_no).padStart(3,"0")+".webp";
}
buildAnswer=function(p,a){
  const imageSrc=answerImageSrc(p,a);
  if(imageSrc)return "<img class='ansimg' src='"+imageSrc+"' loading='lazy' alt='解答画像'>";
  return _answerBody(p,a);
};
function render(){
  const p=currentProblem();
  document.getElementById("curNo").textContent=p.problem_no;
  document.getElementById("qmeta").textContent=p.label||p.chapter||"";
  initialState=parseSfen(p.sfen);
  currentState=cloneBoardState(initialState);
  answerSolved=false;
  clearSelection();
  renderBoard(document.getElementById("boardHost"),currentState);
  document.getElementById("answer").innerHTML=buildAnswer(p,p.answer);
  showAnswer(false);
  syncBoardTools();
  document.getElementById("jumpInp").value=p.problem_no;
  savePos();
}
function go(n){curIdx=Math.max(0,Math.min(n,DATA.length-1));render();}

document.getElementById("prevBtn").onclick=()=>go(curIdx-1);
document.getElementById("nextBtn").onclick=()=>go(curIdx+1);
document.getElementById("showBtn").onclick=()=>{
  const ans=document.getElementById("answer");
  showAnswer(!ans.classList.contains("show"));
};
if(document.getElementById("answerModeBtn"))document.getElementById("answerModeBtn").onclick=()=>{
  if(!supportsAutoJudge())return;
  playMode="answer";
  resetBoardState();
  showAnswer(false);
};
if(document.getElementById("reviewModeBtn"))document.getElementById("reviewModeBtn").onclick=()=>{
  playMode="review";
  resetBoardState();
  showAnswer(false);
};
document.getElementById("resetBtn").onclick=()=>resetBoardState();
document.getElementById("copySfenBtn").onclick=()=>copyCurrentSfen();
document.getElementById("promoteBtn").onclick=()=>resolvePromotion(true);
document.getElementById("stayBtn").onclick=()=>resolvePromotion(false);
document.getElementById("jumpBtn").onclick=()=>{
  const v=+document.getElementById("jumpInp").value;
  const i=DATA.findIndex(p=>p.problem_no===v);
  if(i>=0)go(i);
};
document.getElementById("jumpInp").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("jumpBtn").click();});
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){if(dx<0)go(curIdx+1);else go(curIdx-1);}
},{passive:true});
function sizeBoard(){
  const vv=window.visualViewport;
  const w=(vv&&vv.width)||window.innerWidth;
  const h=(vv&&vv.height)||window.innerHeight;
  const wrap=document.querySelector(".wrap");
  const boardBox=document.querySelector(".boardbox");
  const boardRow=document.querySelector(".boardrow");
  const right=document.querySelector(".right");
  const tools=document.querySelector(".boardtools");
  const hands=[...document.querySelectorAll(".hand")];
  const twoCol=w>820;
  const rowStyle=boardRow?getComputedStyle(boardRow):null;
  const gap=rowStyle?parseFloat(rowStyle.columnGap||rowStyle.gap||"0"):0;
  let availW=(twoCol?w*0.96:w*0.96)-24;
  if(boardRow&&tools){
    availW=boardRow.clientWidth-tools.getBoundingClientRect().width-gap-6;
  }
  let availH=(twoCol?h:h*0.60)-120;
  if(twoCol&&right&&boardBox){
    const handHeights=hands.reduce((sum,el)=>sum+el.getBoundingClientRect().height,0);
    const boxStyle=getComputedStyle(boardBox);
    const boxGap=parseFloat(boxStyle.rowGap||boxStyle.gap||"0");
    availH=right.clientHeight-handHeights-(boxGap*2)-8;
  }
  if(wrap&&twoCol&&wrap.clientWidth<1180){
    availW-=6;
  }
  const byH=Math.max(22,availH)/9.7;
  const byW=Math.max(22,availW)/10.15;
  const maxCell=(twoCol&&w<1280)?58:66;
  const cell=Math.max(22,Math.min(maxCell,Math.floor(Math.min(byH,byW))));
  document.documentElement.style.setProperty("--cell",cell+"px");
  document.documentElement.style.setProperty("--bw",(cell*10)+"px");
}
function relocateJumpControls(){
  const jump=document.querySelector(".jump");
  const tools=document.querySelector(".boardtools");
  if(!jump||!tools)return;
  const status=document.getElementById("toolStatus");
  if(status)status.style.display="none";
  const situation=document.getElementById("situation");
  if(situation)situation.remove();
  const oldNav=document.querySelector(".navrow-fixed");
  if(oldNav)oldNav.remove();
  const showBtn=document.getElementById("showBtn");
  const prevBtn=document.getElementById("prevBtn");
  const nextBtn=document.getElementById("nextBtn");
  let actions=tools.querySelector(".tool-actions");
  if(!actions){
    actions=document.createElement("div");
    actions.className="tool-actions";
    tools.appendChild(actions);
  }
  let problemNav=actions.querySelector(".problem-nav");
  if(!problemNav){
    problemNav=document.createElement("div");
    problemNav.className="problem-nav";
    actions.appendChild(problemNav);
  }
  if(showBtn){
    showBtn.className="toolbtn showbtn";
    actions.insertBefore(showBtn, problemNav);
  }
  if(prevBtn){
    prevBtn.className="toolbtn nav";
    problemNav.appendChild(prevBtn);
  }
  if(nextBtn){
    nextBtn.className="toolbtn nav";
    problemNav.appendChild(nextBtn);
  }
  if(!jump.querySelector(".jump-label")){
    const label=document.createElement("label");
    label.className="jump-label";
    label.htmlFor="jumpInp";
    label.textContent=(jump.firstChild&&jump.firstChild.textContent||"").trim();
    if(label.textContent){
      jump.insertBefore(label, jump.firstElementChild||null);
    }
    if(jump.firstChild&&jump.firstChild.nodeType===Node.TEXT_NODE){
      jump.removeChild(jump.firstChild);
    }
  }
  const btn=document.getElementById("jumpBtn");
  if(btn)btn.className="jumpbtn";
  jump.classList.add("tooljump");
  tools.insertBefore(jump, document.getElementById("promoBox"));
}
window.addEventListener("resize",sizeBoard);
window.addEventListener("orientationchange",()=>setTimeout(sizeBoard,80));
if(window.visualViewport)window.visualViewport.addEventListener("resize",sizeBoard);
document.getElementById("total").textContent=DATA.length;
relocateJumpControls();loadPos();sizeBoard();render();setTimeout(sizeBoard,60);

</script></body></html>
