<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>右四間飛車 記憶ドリル</title>
<style>
:root{--bg:#f6f1e7;--ink:#2b2118;--sub:#6b5d4d;--card:#fffdf8;--line:#d9cdb8;--accent:#b5382a;--ok:#2f7d4f;--ng:#c0392b;
--board:#e8c47a;--grid:#8a6a35;--piece:#f7e3b0;--hint:rgba(230,160,40,.6);--last:rgba(255,90,60,.3);--sel:rgba(40,120,255,.45);--new:#c98a1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--ink:#f1e9da;--sub:#b9ab96;--card:#2a251f;--line:#4a4136;--accent:#ff8a70;--board:#a8823f;--grid:#3d2e14;--piece:#ecd9a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a16;--ink:#f1e9da;--sub:#b9ab96;--card:#2a251f;--line:#4a4136;--accent:#ff8a70;--board:#a8823f;--grid:#3d2e14;--piece:#ecd9a6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
#app{max-width:1040px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.35rem;margin:.2em 0}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.side{flex:1;min-width:280px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0;font-size:1.05rem}
.opt small{font-size:.8rem;color:var(--sub)}
.badge{font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid var(--new);color:var(--new);margin-left:6px}
.badge.done{border-color:var(--ok);color:var(--ok)}
/* board */
.boardwrap{--cell:clamp(30px,min(6.6vw,6vh),54px);display:inline-block;user-select:none}
.hand{font-size:.9rem;min-height:2.2em;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hp{font:inherit;font-size:1rem;border:1px solid var(--line);background:var(--piece);color:#222;border-radius:6px;padding:0 8px;cursor:pointer;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:700}
.hp.sel{outline:3px solid var(--sel)}.hp.hint{outline:3px solid var(--hint)}
.board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,var(--cell));background:var(--board);border:2px solid var(--grid);margin:2px 0;position:relative}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arrows .hit{pointer-events:stroke;cursor:pointer}.arrows .lab{pointer-events:all;cursor:pointer}
.arrows g{opacity:.85}.arrows g.on{opacity:1}.arrows g.on .shaft{stroke-width:.2}
.lt{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;color:#fff;font-size:.8rem;font-weight:700;margin-right:6px}
.cell{position:relative;border:.5px solid var(--grid);display:flex;align-items:center;justify-content:center}
.cell.last{background:var(--last)}.cell.hint{background:var(--hint)}.cell.sel{background:var(--sel)}.cell.pick{cursor:pointer}
.board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.piece{width:84%;height:90%;background:var(--piece);color:#222;clip-path:polygon(50% 0,88% 18%,100% 100%,0 100%,12% 18%);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.52);font-weight:700;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;padding-top:8%}
.piece.pro{color:#c0281c}.piece.rot{transform:rotate(180deg)}
.coord{display:grid;grid-template-columns:repeat(9,var(--cell));font-size:.7rem;color:var(--sub);text-align:center}
.coordv{position:absolute;right:-1.2em;top:0;bottom:0;display:grid;grid-template-rows:repeat(9,var(--cell));font-size:.7rem;color:var(--sub);align-items:center}
.bwrap{position:relative;padding-right:1.2em}
.msg{min-height:3em;font-size:1.02rem}.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0}.prog b{display:block;height:100%;background:var(--ok)}
.small{font-size:.85rem;color:var(--sub)}
.moves{display:flex;flex-wrap:wrap;gap:4px}
.mv{font-size:.85rem;padding:1px 7px;border:1px solid var(--line);border-radius:6px}.mv.last{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmt{white-space:pre-wrap}
#promo{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#promo .card{display:flex;gap:12px;align-items:center;font-size:1.1rem}
</style>
</head>
<body>
<div id="app">
 <h1>右四間飛車 記憶ドリル</h1>
 <div class="small" id="src"></div>
 <div class="prog"><b id="pbar"></b></div>
 <div class="small" id="ptext"></div>
 <div class="row" style="margin-top:8px">
  <div id="bd"></div>
  <div class="side">
   <div class="card msg" id="msg"></div>
   <div id="opp"></div>
   <div class="chips">
    <button class="btn" id="hint">ヒント（動かす駒）</button>
    <button class="btn" id="undo">1手戻る</button>
    <button class="btn" id="home">基本図に戻る</button>
   </div>
   <div class="card" id="cmtbox" style="display:none"><div class="small">棋譜のコメント</div><div class="cmt" id="cmt"></div></div>
   <div class="card"><div class="small">基本図からの手順</div><div class="moves" id="moves"></div></div>
   <p class="small">あなたは<b>後手（右四間飛車）</b>です。動かす駒をクリックしてから行き先をクリックします。持ち駒は盤の下のボタンから選びます。<br>
   棋譜どおりに指すと、相手の候補手が盤上に矢印で出ます。候補が1つなら相手が自動で指し、2つ以上なら矢印（A・B…）か行き先のマスをクリックして、進む変化を選びます。10秒選ばないとランダムで進みます。</p>
   <p class="small">学習記録はこのブラウザに保存されます。<button class="btn" id="reset" style="font-size:.8rem;padding:2px 8px">記録を消す</button></p>
  </div>
 </div>
</div>
<div id="promo"><div class="card">成りますか？ <button class="btn pri" id="pyes">成る</button><button class="btn" id="pno">成らない</button></div></div>

const N = D.nodes;

function parse(sfen){const [bd,turn,hand]=sfen.split(' ');const g=[];
 bd.split('/').forEach(row=>{const r=[];let pro='';for(const ch of row){if(ch==='+'){pro='+';continue}
  if(/\d/.test(ch)){for(let i=0;i<+ch;i++)r.push(null)}else{r.push({c:ch===ch.toUpperCase()?'b':'w',p:pro+ch.toUpperCase()});pro=''}}g.push(r)});
 const h={b:{},w:{}};if(hand&&hand!=='-'){let n='';for(const ch of hand){if(/\d/.test(ch)){n+=ch}else{const c=ch===ch.toUpperCase()?'b':'w';h[c][ch.toUpperCase()]=(+n||1);n=''}}}
 return {g,turn,h}}
const at=(P,f,r)=>P.g[r-1][9-f];

const KEY='migishiken_drill_v1:'+D.title;

function saveRec(){try{localStorage.setItem(KEY,JSON.stringify(rec))}catch(e){}}
const isDone=l=>rec[l]==='clean'||rec[l]==='hint';

let AC=null;function tone(f,d,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.12;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sPlace=()=>tone(220,.08,'triangle',.25),sErr=()=>{tone(160,.18,'square',.08);setTimeout(()=>tone(120,.22,'square',.08),120)},
 sDone=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*130));

let path=[D.start], sel=null, miss=0, hintOn=false, usedHint=false, timer=null, msg='', pending=null;

function boardHTML(P,o){let cells='';
 for(let dr=0;dr<9;dr++)for(let dc=0;dc<9;dc++){const f=dc+1,r=9-dr;const pc=at(P,f,r);const k=f+','+r;let cls='cell';
  if(o.last&&o.last.includes(k))cls+=' last';if(o.hint===k)cls+=' hint';if(o.sel===k)cls+=' sel';if(o.pick)cls+=' pick';
  const inner=pc?`<div class="piece${pc.p[0]==='+'?' pro':''}${pc.c==='w'?'':' rot'}">${NAME[pc.p]}</div>`:'';
  cells+=`<div class="${cls}" data-k="${k}">${inner}</div>`}
 const cols=[];for(let i=0;i<9;i++)cols.push(`<div>${i+1}</div>`);const rows=[];for(let i=0;i<9;i++)rows.push(`<div>${KN[9-i]}</div>`);
 const hand=(c,click)=>HORDER.split('').filter(p=>P.h[c][p]).map(p=>{const n=P.h[c][p];const lab=NAME[p]+(n>1?n:'');
   return click?`<button class="hp${o.selHand===p?' sel':''}${o.hintHand===p?' hint':''}" data-p="${p}">${lab}</button>`:`<span>${lab}</span>`}).join(' ')||'なし';
 return `<div class="boardwrap"><div class="hand">先手（四間飛車） 持駒: ${hand('b',false)}</div><div class="coord">${cols.join('')}</div>
 <div class="bwrap"><div class="board" id="board">${cells}${arrowsSVG(o.arrows||[])}</div><div class="coordv">${rows.join('')}</div></div>
 <div class="hand">後手（あなた） 持駒: ${hand('w',o.pick)}</div></div>`}

// ---- 相手の候補手を盤上に矢印で描く（後手が手前: 筋 f → x=f-1, 段 r → y=9-r）
const COLORS=['#2f6fd6','#d0402b','#2f9d5a','#b07a12','#8e44ad'];
const LETTER='ABCDE';
const cxy=([f,r])=>[f-.5,9.5-r];
function arrowsSVG(list){if(!list.length)return '';
 const defs=list.map((a,i)=>`<marker id="ah${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${a.color}"/></marker>`).join('');
 const gs=list.map((a,i)=>{const [tx,ty]=cxy(a.to);let body='';
  if(a.from){const [fx,fy]=cxy(a.from);const dx=tx-fx,dy=ty-fy,L=Math.hypot(dx,dy);const ex=tx-dx/L*.28,ey=ty-dy/L*.28;
   body=`<line class="shaft" x1="${fx}" y1="${fy}" x2="${ex}" y2="${ey}" stroke="${a.color}" stroke-width=".13" stroke-linecap="round" marker-end="url(#ah${i})"/>
   <line class="hit" x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" stroke="transparent" stroke-width=".5" data-i="${i}"/>`}
  else{body=`<circle cx="${tx}" cy="${ty}" r=".42" fill="none" stroke="${a.color}" stroke-width=".09" stroke-dasharray=".12 .08"/>
   <text x="${tx}" y="${ty+.17}" font-size=".42" text-anchor="middle" fill="${a.color}" font-weight="700">${a.drop}</text>`}
  const lx=tx+.3,ly=ty-.3;
  return `<g data-i="${i}">${body}<g class="lab" data-i="${i}"><circle cx="${lx}" cy="${ly}" r=".2" fill="${a.color}" stroke="#fff" stroke-width=".03"/><text x="${lx}" y="${ly+.08}" font-size=".24" text-anchor="middle" fill="#fff" font-weight="700">${a.label}</text></g></g>`}).join('');
 return `<svg class="arrows" viewBox="0 0 9 9" aria-hidden="true"><defs>${defs}</defs>${gs}</svg>`}

function render(){const n=cur();const P=parse(n.s);const mine=myTurn(n)&&n.ch.length>0;
 let hint=null,hintHand=null;if(mine&&hintOn){const c=n.ch[0];if(c.drop)hintHand=c.drop;else hint=c.from.join(',')}
 const last=n.lt?[n.lt.join(','),n.lf?n.lf.join(','):null]:[];
 const opp=!myTurn(n)&&n.ch.length>0, branch=opp&&n.ch.length>1;
 const arrows=opp?n.ch.map((c,i)=>({from:c.from,to:c.to,drop:c.drop?NAME[c.drop]:null,color:COLORS[i%COLORS.length],label:n.ch.length>1?LETTER[i]:''})):[];
 $('#bd').innerHTML=boardHTML(P,{pick:mine||branch,last,hint,hintHand,sel:sel&&sel.k,selHand:sel&&sel.p,arrows});
 if(branch){const pickIdx=i=>advance(n.ch[i].id);
  document.querySelectorAll('.arrows .hit,.arrows .lab').forEach(e=>e.onclick=ev=>{ev.stopPropagation();pickIdx(+e.dataset.i)});
  // 行き先マスのクリックでも選べる（同じマスに行く候補が1つだけのとき）
  document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{const k=c.dataset.k;const hit=n.ch.map((x,i)=>[x,i]).filter(([x])=>x.to.join(',')===k);if(hit.length===1)pickIdx(hit[0][1])})}
 if(mine){document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>clickSq(c.dataset.k));
  document.querySelectorAll('.hp').forEach(b=>b.onclick=()=>{sel=(sel&&sel.p===b.dataset.p)?null:{p:b.dataset.p};render()})}
 // メッセージ
 let m=msg;if(!m){if(n.ch.length===0)m='';else if(mine)m=n.ch.length>1?`あなたの番です。この局面では棋譜の手が <b>${n.ch.length}通り</b> あります。どれを指しても、その変化に進みます。`:'あなたの番です。棋譜の手を指してください。'}
 $('#msg').innerHTML=m;
 // 相手の候補
 renderOpp(n);
 // コメント
 const cm=n.c.filter(x=>x!=='基本図');$('#cmtbox').style.display=cm.length?'':'none';$('#cmt').textContent=cm.join('\n');
 // 手順
 const mv=path.slice(1).map((id,i,a)=>`<span class="mv${i===a.length-1?' last':''}">${N[id].t}</span>`);
 $('#moves').innerHTML=mv.join('')||'<span class="small">（基本図。△の手から始めます）</span>';
 $('#hint').disabled=!mine;$('#undo').disabled=path.length<=1;
 const done=Object.keys(rec).filter(k=>isDone(+k)&&+k<D.nleaf).length;
 $('#pbar').style.width=(done/D.nleaf*100)+'%';
 const clean=Object.keys(rec).filter(k=>rec[k]==='clean'&&+k<D.nleaf).length;
 $('#ptext').textContent=`学習済みの変化 ${done} / ${D.nleaf}（うちヒントなし ${clean}）`}

function stat(id){const lv=N[id].lv;return {n:lv.length,k:lv.filter(isDone).length}}
function renderOpp(n){const box=$('#opp');box.innerHTML='';
 if(myTurn(n)||n.ch.length<2)return;
 box.innerHTML=`<div class="card"><div class="small">相手の候補手（盤上の矢印・行き先のマス・下のボタンのどれでも選べます）</div><div class="prog"><b id="cdbar" style="width:100%;background:var(--accent);transition:width 1s linear"></b></div>${n.ch.map((c,i)=>{const s=stat(c.id);
  const b=s.k<s.n?`<span class="badge">未学習あり</span>`:`<span class="badge done">済</span>`;
  return `<button class="btn opt" data-i="${i}"><span><span class="lt" style="background:${COLORS[i%COLORS.length]}">${LETTER[i]}</span>${N[c.id].t}${b}</span><small>この先の変化 ${s.n}本 / 学習済み ${s.k}本</small></button>`}).join('')}</div>`;
 const hl=(i,on)=>{const g=document.querySelector(`.arrows > g[data-i="${i}"]`);if(g)g.classList.toggle('on',on)};
 box.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.onclick=()=>advance(n.ch[i].id);b.onmouseenter=()=>hl(i,true);b.onmouseleave=()=>hl(i,false)})}

// ---- 盤のクリック
function clickSq(k){const n=cur();const P=parse(n.s);const [f,r]=k.split(',').map(Number);const pc=at(P,f,r);
 if(sel&&sel.p){tryMove({drop:sel.p,to:[f,r]});return}
 if(!sel){if(pc&&pc.c==='w'){sel={k};msg='行き先をクリックしてください。';render()}return}
 if(k===sel.k){sel=null;msg='';render();return}
 if(pc&&pc.c==='w'){sel={k};render();return}
 tryMove({from:sel.k.split(',').map(Number),to:[f,r]})}

const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
function tryMove(mv){const n=cur();
 const hits=n.ch.filter(c=>same(c.to,mv.to)&&(mv.drop?c.drop===mv.drop:(!c.drop&&same(c.from,mv.from))));
 sel=null;
 if(!hits.length){wrong();return}
 if(hits.some(c=>c.promoOpt)){pending=hits;$('#promo').style.display='flex';return}
 correct(hits[0])}
function choosePromo(yes){$('#promo').style.display='none';const hits=pending;pending=null;if(!hits)return;
 const c=hits.find(x=>x.promote===yes);if(c)correct(c);else wrong(yes?'この手は成りません（棋譜は不成）。':'この手は成ります（棋譜は成り）。')}
$('#pyes').onclick=()=>choosePromo(true);$('#pno').onclick=()=>choosePromo(false);

function wrong(why){miss++;sErr();if(miss>=2&&!hintOn){hintOn=true;usedHint=true}
 msg=`<span class="ng">棋譜にない手です。</span>${why||''}${hintOn?'光っている駒を動かしてみましょう。':'もう一度指してみましょう。'}`;
 render();const b=$('#board');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}

function correct(c){sPlace();miss=0;hintOn=false;msg=`<span class="ok">正解：${N[c.id].t}</span>`;advance(c.id)}

// ---- 局面を進める（自分の手・相手の手共通）
const AUTO_MS=500, PICK_SEC=10;
let cd=null;
function stopTimers(){clearTimeout(timer);clearInterval(cd);cd=null}
function advance(id){stopTimers();path.push(id);sel=null;const n=N[id];
 if(n.ch.length===0){finish();return}
 if(myTurn(n)){render();return}
 // 相手の番
 if(n.ch.length===1){const c=n.ch[0];msg=(msg?msg+'<br>':'')+`相手の手：<b>${N[c.id].t}</b>`;render();
  timer=setTimeout(()=>{sPlace();msg='';advance(c.id)},AUTO_MS)}
 else{msg=(msg?msg+'<br>':'')+`相手の候補手が <b>${n.ch.length}つ</b> あります。矢印か行き先のマスをクリックして選んでください。<br><span class="small"><b id="cdn">${PICK_SEC}</b> 秒選ばないと、ランダムで進みます。</span>`;render();
  let left=PICK_SEC;cd=setInterval(()=>{left--;const e=$('#cdn');if(e)e.textContent=left;const b=$('#cdbar');if(b)b.style.width=(left/PICK_SEC*100)+'%';
   if(left<=0){const c=n.ch[Math.floor(Math.random()*n.ch.length)];sPlace();msg=`ランダムで <b>${N[c.id].t}</b> に進みました。`;advance(c.id)}},1000)}}

function finish(){const n=cur();const l=n.leaf;
 if(l!=null){const prev=rec[l];if(!usedHint)rec[l]='clean';else if(prev!=='clean')rec[l]='hint';saveRec()}
 sDone();const cm=n.c.filter(x=>x!=='基本図').join(' / ');
 msg=(msg?msg+'<br>':'')+`<span class="ok">この変化は完了です。</span>${cm?'<br>'+cm:''}${usedHint?'<br><span class="small">ヒントを使ったので「ヒントあり」で記録しました。</span>':''}<br><span class="small">「基本図に戻る」で別の変化を練習できます。</span>`;
 render()}

$('#hint').onclick=()=>{hintOn=true;usedHint=true;msg='光っている駒（または持ち駒）を動かしてください。';render()};
$('#undo').onclick=()=>{stopTimers();if(path.length<=1)return;path.pop();while(path.length>1&&!myTurn(cur()))path.pop();
 sel=null;miss=0;hintOn=false;msg='1手戻しました。';render()};
$('#home').onclick=()=>{stopTimers();path=[D.start];sel=null;miss=0;hintOn=false;usedHint=false;msg='';render()};
// 記録を消す: confirm() が使えない環境があるので、ボタンを2回押す方式にする
let resetArm=null;
$('#reset').onclick=()=>{const b=$('#reset');
 if(!resetArm){b.textContent='もう一度押すと消します';resetArm=setTimeout(()=>{resetArm=null;b.textContent='記録を消す'},4000);return}
 clearTimeout(resetArm);resetArm=null;b.textContent='記録を消す';rec={};saveRec();msg='学習記録を消しました。';render()};
$('#src').textContent='棋譜: '+D.title+'.kif（基本図＝'+N[D.start].p+'手目まで）';
render();
</script>
</body>
</html>
