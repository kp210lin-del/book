<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>右四間飛車 記憶ドリル</title>
<style>
/* 配色・盤・持駒欄・ボタン列は本のデータのビューア（_build/make_viewer.py / bookviewer-spec.md）と共通 */
:root{
  --bg:#1f2430; --panel:#2a3140; --line:#3a4150; --ink:#eef2f7;
  --sub:#9aa7bd; --accent:#e0853a; --ok:#46b46b; --bad:#d9534f;
  --board:#e8c479; --grid:#7a5a22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px;
  padding-bottom:8px;border-bottom:1px solid #333}
.meta .back{font-size:15px;padding:8px 12px;border-radius:10px;background:#2a3140}
.meta .bktitle{font-size:19px;font-weight:700}
.meta select{font-size:15px;padding:7px 8px;border-radius:10px;border:1px solid #000;
  background:var(--panel);color:var(--ink);max-width:100%}
.meta .counter{font-size:15px;color:var(--sub);white-space:nowrap}
.meta .counter b{color:var(--ink);font-size:20px}
.wrap{display:flex;gap:14px;padding:10px;align-items:stretch;max-width:1600px;margin:0 auto;
  height:100dvh;max-height:100dvh;overflow:hidden}
.left{flex:1 1 calc(var(--bw) + 48px);min-width:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.right{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.boardbox{display:flex;flex-direction:column;align-items:center;gap:5px}
.boardrow{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%}
.boardwrap{position:relative}
.boardtools{display:flex;flex-direction:column;gap:8px;width:108px}
.toolbtn{width:100%;padding:10px 8px;border-radius:10px;border:1px solid #000;
  background:#39414f;color:var(--ink);font-size:15px;font-weight:700;min-height:44px}
.toolbtn.active{background:var(--accent);color:#1b1b1b}
.toolbtn.sub{font-size:12px;font-weight:600;min-height:36px;color:var(--sub);background:#2f3644}
.toolbtn:disabled{opacity:.45;cursor:default}
.promobox{display:none;flex-direction:column;gap:10px;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);z-index:20;background:rgba(20,24,32,.95);
  border:2px solid var(--accent);border-radius:14px;padding:18px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.55);min-width:160px}
.promolabel{font-size:15px;color:var(--ink);text-align:center;font-weight:700}
.promobtn{width:100%;padding:12px 8px;border-radius:10px;border:1px solid #000;
  background:#5d6a82;color:var(--ink);font-size:17px;font-weight:700;min-height:48px}
/* 盤（表の代わりに grid。線と枠はビューアの table.board と同じ見た目） */
.board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,var(--cell));
  gap:1px;background:var(--grid);border:3px solid var(--grid);box-shadow:0 6px 20px rgba(0,0,0,.45);
  position:relative;user-select:none;-webkit-user-select:none}
.cell{background:var(--board);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell)*.72);line-height:1;font-weight:600;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.cell.b{color:#16407a} .cell.w{color:#a32a2a}
.rot{display:inline-block;transform:rotate(180deg)}
.cell.pick{cursor:pointer}
.cell.last{background:#f0bf7e}
.cell.sel{background:#f3a764;box-shadow:inset 0 0 0 3px var(--accent)}
.cell.hint{background:#a6d48f}
.cell.free{background:#b9a06c}
.cell.cond{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .emp{color:#7a5a22;font-size:.6em;font-family:sans-serif}
.board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arrows g{opacity:.9;transition:opacity .15s}.arrows g.on{opacity:1}.arrows g.on .shaft{stroke-width:.2}
.arrows.dim g:not(.on){opacity:.25}
/* 座標は盤の外（上=筋 / 右=段） */
.brd{display:inline-block}
.files{display:flex;padding-left:3px}
.files i{width:calc(var(--cell) + 1px);text-align:center;font-style:normal;font-weight:700;
  font-size:calc(var(--cell)*.23);color:var(--sub);font-family:sans-serif;padding-bottom:3px}
.bmid{display:flex;align-items:flex-start}
.ranks{display:flex;flex-direction:column;padding-top:3px}
.ranks i{height:calc(var(--cell) + 1px);display:flex;align-items:center;justify-content:center;
  width:calc(var(--cell)*.62);font-style:normal;font-weight:700;
  font-size:calc(var(--cell)*.23);color:var(--sub);font-family:sans-serif}
.hands{display:flex;flex-direction:column;gap:4px;width:100%;max-width:var(--bw)}
.hand{display:flex;align-items:flex-start;gap:8px;background:var(--panel);
  border:1px solid #000;border-radius:10px;padding:8px 10px;font-size:17px;min-height:56px}
.hand .lab{color:var(--sub);font-size:13px;flex:0 0 auto;padding-top:5px}
.hand .pc{display:flex;flex-wrap:wrap;gap:8px}
.handbtn{min-width:44px;min-height:40px;padding:4px 8px;border-radius:10px;border:1px solid #000;
  background:#485164;color:var(--ink);font-size:24px;line-height:1;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;display:inline-flex;align-items:center;justify-content:center}
.handbtn small{font-size:14px;margin-left:2px}
.handbtn.ro{cursor:default}
.handbtn.sel{background:var(--accent);color:#1b1b1b}
.handbtn.hint{background:var(--ok);color:#08240f}
.handempty{font-size:15px;color:var(--sub);padding-top:7px}
/* 左カラム */
.qmeta{font-size:13px;color:var(--sub);margin:10px 0 4px}
.situation{background:var(--panel);border:1px solid #000;border-radius:12px;
  padding:10px 12px;font-size:16px;line-height:1.5;margin-bottom:8px;min-height:46px}
.situation small{color:var(--sub);font-size:13px}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--bad);font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--accent);
  color:#1b1b1b;font-weight:700;margin-right:8px;vertical-align:1px}
.cdwrap{height:6px;background:#39414f;border-radius:4px;overflow:hidden;margin:2px 0 6px}
.cdwrap b{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 6px;
  padding:9px 12px;border-radius:10px;border:1px solid #000;background:#39414f;color:var(--ink);font-size:18px}
.opt .mvn{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;flex:1}
.opt small{font-size:13px;color:var(--sub)}
.lt{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  color:#fff;font-size:14px;font-weight:700;flex:0 0 auto}
.badge{font-size:12px;padding:1px 8px;border-radius:20px;background:var(--ok);color:#08240f;font-weight:700}
#ambnote{font-size:14px;min-height:0}
.seq{font-size:17px;line-height:1.9;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.seq .ply{display:inline-block;padding:1px 7px;margin:2px;border-radius:8px;background:#39414f;border:0;color:var(--ink);font:inherit}
.seq .ply.cur{background:var(--accent);color:#1b1b1b}
.seq .sub{color:var(--sub);font-size:14px;font-family:sans-serif}
.cmt{background:var(--panel);border:1px solid #000;border-radius:12px;padding:10px 12px;margin-top:10px;
  font-size:15px;line-height:1.6;white-space:pre-wrap;color:#d4dbe8}
/* 局面検索 */
.pal{display:flex;flex-direction:column;gap:6px}
.pal .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pal .row > span{width:20px;color:var(--sub);font-size:15px}
.pbtn{min-width:36px;min-height:38px;padding:2px 4px;border-radius:8px;border:1px solid #000;background:var(--board);
  font-size:20px;line-height:1;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600}
.pbtn.b{color:#16407a}.pbtn.w{color:#a32a2a}
.pbtn.txt{background:#39414f;color:var(--ink);font-size:14px;font-family:inherit;padding:2px 10px}
.pbtn.on{box-shadow:0 0 0 3px var(--accent)}
.res,.var{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 12px;border-radius:10px;
  border:1px solid #000;background:#39414f;color:var(--ink);font-size:15px;line-height:1.5}
.res b{font-weight:700}.res small,.var small{display:block;color:var(--sub);font-size:13px}
.res .mvs,.var .mvs{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px}
.none{color:var(--sub);font-size:15px;padding:6px 2px}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:stretch;gap:6px}
  .right{order:1;width:100%;flex:0 0 auto}
  .left{order:2;width:100%;flex:1 1 auto;min-height:0;height:auto;overflow-y:auto}
  .boardtools{width:96px}
  .toolbtn{font-size:14px;min-height:40px;padding:8px 6px}
  .hand{min-height:48px;padding:5px 8px}
  .handbtn{min-height:36px;font-size:21px}
}

 bd.split('/').forEach(row=>{const r=[];let pro='';for(const ch of row){if(ch==='+'){pro='+';continue}
  if(/\d/.test(ch)){for(let i=0;i<+ch;i++)r.push(null)}else{r.push({c:ch===ch.toUpperCase()?'b':'w',p:pro+ch.toUpperCase()});pro=''}}g.push(r)});
 const h={b:{},w:{}};if(hand&&hand!=='-'){let n='';for(const ch of hand){if(/\d/.test(ch)){n+=ch}else{const c=ch===ch.toUpperCase()?'b':'w';h[c][ch.toUpperCase()]=(+n||1);n=''}}}
 return {g,turn,h}}
const at=(P,f,r)=>P.g[r-1][9-f];

// 章ごとの下ごしらえ: 開始局面から下の局面の一覧（検索用）と、変化番号→末端の局面
D.chapters.forEach(ch=>{ch._order=[];ch._leafNode={};ch._P={};
 const walk=i=>{ch._order.push(i);const n=ch.nodes[i];if(n.leaf!=null)ch._leafNode[n.leaf]=i;n.ch.forEach(c=>walk(c.id))};walk(ch.start)});

// ---- 章（C=いまの章、N=その局面ツリー、ME=自分の手番 b/w）
let C=null,N=null,ME='b',OPP='w';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

// ---- 学習記録（章ごと。キーは開始局面からの手順。localStorage が使えなくても動く）
const recKey=ch=>'migishiken_drill_v2:'+ch.id;
function loadRec(ch){let r={};try{r=JSON.parse(lsGet(recKey(ch))||'{}')||{}}catch(e){r={}}
 // 初版（章なし・変化番号がキー）の記録を引き継ぐ
 if(ch.legacy&&lsGet(recKey(ch))===null){let o={};try{o=JSON.parse(lsGet(ch.legacy.key)||'{}')||{}}catch(e){o={}}
  for(const k in o){const lk=ch.legacy.map[k];if(lk!=null&&(o[k]==='clean'||o[k]==='hint'))r[lk]=o[k]}
  lsSet(recKey(ch),JSON.stringify(r))}
 return r}
let rec={};
function saveRec(){lsSet(recKey(C),JSON.stringify(rec))}
const isDoneIn=(ch,r,l)=>r[ch.lkeys[l]]==='clean'||r[ch.lkeys[l]]==='hint';
const isDone=l=>isDoneIn(C,rec,l);
function progress(ch,r){let done=0,clean=0;for(let l=0;l<ch.nleaf;l++){const v=r[ch.lkeys[l]];if(v==='clean'||v==='hint')done++;if(v==='clean')clean++}return {done,clean}}

// ---- 音
let AC=null;function tone(f,d,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.12;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sPlace=()=>tone(220,.08,'triangle',.25),sErr=()=>{tone(160,.18,'square',.08);setTimeout(()=>tone(120,.22,'square',.08),120)},
 sDone=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*130));

// ---- 状態。mode: drill=練習 / search=局面検索 / view=閲覧（検索結果から開いた局面を両方の手で進める）
let mode='drill';
let path=[], sel=null, miss=0, hintOn=false, usedHint=false, partial=false, timer=null, msg='', pending=null;
let pat={}, palV='b:P', searchBase=null;
const cur=()=>N[path[path.length-1]];
const turnOf=n=>n.s.split(' ')[1];
const myTurn=n=>turnOf(n)===ME;

// 盤の向き: 自分が手前。後手なら 1筋が左・九段が上、先手なら 9筋が左・一段が上
const sqAt=(dr,dc)=>ME==='w'?[dc+1,9-dr]:[9-dc,dr+1];
const pieceHTML=pc=>`<span class="${pc.c===ME?'':'rot'}">${NAME[pc.p]}</span>`;
function boardHTML(P,o){let cells='';
 for(let dr=0;dr<9;dr++)for(let dc=0;dc<9;dc++){const [f,r]=sqAt(dr,dc);const k=f+','+r;
  let pc,cls='cell',inner='';
  if(o.pat){const v=o.pat[k];pc=v&&v!=='empty'?{c:v[0],p:v.slice(2)}:null;cls+=v==null?' free':' cond';if(v==='empty')inner='<span class="emp">×</span>'}
  else pc=at(P,f,r);
  if(pc){cls+=' '+pc.c;inner=pieceHTML(pc)}
  if(o.last&&o.last.includes(k))cls+=' last';if(o.hint===k)cls+=' hint';if(o.sel===k)cls+=' sel';if(o.pick)cls+=' pick';
  cells+=`<div class="${cls}" data-k="${k}">${inner}</div>`}
 let files='',ranks='';for(let i=0;i<9;i++){files+=`<i>${ME==='w'?i+1:9-i}</i>`;ranks+=`<i>${KN[ME==='w'?9-i:i+1]}</i>`}
 return `<div class="brd"><div class="files">${files}</div><div class="bmid"><div class="board" id="board">${cells}${arrowsSVG(o.arrows||[])}</div><div class="ranks">${ranks}</div></div></div>`}
function handHTML(P,c,click,o){
 const items=HORDER.split('').filter(p=>P.h[c][p]).map(p=>{const n=P.h[c][p];const inner=`<span class="${c===ME?'':'rot'}">${NAME[p]}</span>${n>1?`<small>${n}</small>`:''}`;
  return click?`<button class="handbtn hp${o.selHand===p?' sel':''}${o.hintHand===p?' hint':''}" data-p="${p}">${inner}</button>`:`<span class="handbtn ro">${inner}</span>`}).join('');
 return `<span class="lab">${SIDENAME[c]} 持駒</span><span class="pc">${items||'<span class="handempty">なし</span>'}</span>`}
function drawBoard(P,o){$('#bd').innerHTML=boardHTML(P,o);
 if(o.pat){$('#handTop').innerHTML=$('#handBot').innerHTML='<span class="handempty">持駒は比べません</span>'}
 else{$('#handTop').innerHTML=handHTML(P,OPP,false,o);$('#handBot').innerHTML=handHTML(P,ME,o.pick,o)}}

// ---- 候補手を盤上に矢印で描く（マスの中心: 後手が手前なら x=f-.5,y=9.5-r、先手が手前なら x=9.5-f,y=r-.5）
const COLORS=['#2f6fd6','#d0402b','#2f9d5a','#b07a12','#8e44ad'];
const LETTER='ABCDE';
const cxy=([f,r])=>ME==='w'?[f-.5,9.5-r]:[9.5-f,r-.5];
// ラベル（A・B…）は矢印の上の、ほかのラベルと重ならない位置に置く。
// 同じマスへ行く候補・同じ駒が動く候補でもラベルが重ならないようにするため（重なると後に描いた方しか押せない）
let ARW=[];
function layoutArrows(list){const placed=[];
 list.forEach(a=>{const [tx,ty]=cxy(a.to);a.tx=tx;a.ty=ty;const cands=[];
  if(a.from){const [fx,fy]=cxy(a.from);a.fx=fx;a.fy=fy;const dx=tx-fx,dy=ty-fy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
   for(const s of [.55,.3,.8])if(s<L-.1)for(const p of [0,.3,-.3])cands.push([tx-ux*s-uy*p,ty-uy*s+ux*p])}
  for(const [ox,oy] of [[.3,-.3],[-.3,-.3],[.3,.3],[-.3,.3]])cands.push([tx+ox,ty+oy]);
  const c=cands.find(c=>placed.every(q=>Math.hypot(c[0]-q[0],c[1]-q[1])>=.52))||cands[0];
  a.lx=c[0];a.ly=c[1];placed.push(c)});
 return list}
function arrowsSVG(list){ARW=layoutArrows(list);if(!list.length)return '';
 const defs=list.map((a,i)=>`<marker id="ah${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${a.color}"/></marker>`).join('');
 const bodies=list.map((a,i)=>{let body='';
  if(a.from){const dx=a.tx-a.fx,dy=a.ty-a.fy,L=Math.hypot(dx,dy);const ex=a.tx-dx/L*.28,ey=a.ty-dy/L*.28;
   body=`<line class="shaft" x1="${a.fx}" y1="${a.fy}" x2="${ex}" y2="${ey}" stroke="${a.color}" stroke-width=".13" stroke-linecap="round" marker-end="url(#ah${i})"/>`}
  else{body=`<circle cx="${a.tx}" cy="${a.ty}" r=".42" fill="none" stroke="${a.color}" stroke-width=".09" stroke-dasharray=".12 .08"/>
   <text x="${a.tx}" y="${a.ty+.17}" font-size=".42" text-anchor="middle" fill="${a.color}" font-weight="700">${a.drop}</text>`}
  return `<g class="arw" data-i="${i}">${body}</g>`}).join('');
 // ラベルは全部の矢印の上に描く
 const labs=list.map((a,i)=>a.label?`<g class="lab" data-i="${i}"><circle cx="${a.lx}" cy="${a.ly}" r=".22" fill="${a.color}" stroke="#fff" stroke-width=".035"/><text x="${a.lx}" y="${a.ly+.09}" font-size=".26" text-anchor="middle" fill="#fff" font-weight="700">${a.label}</text></g>`:'').join('');
 return `<svg class="arrows" viewBox="0 0 9 9" aria-hidden="true"><defs>${defs}</defs>${bodies}${labs}</svg>`}

// 盤上のクリック位置（マス単位の座標）から候補を1つ決める。
// 戻り値 {i}=決まった / {amb:[…]}=重なっていて決められない / null=どの候補でもない
function segDist(x,y,a){if(!a.from)return Math.max(0,Math.hypot(x-a.tx,y-a.ty)-.42);
 const vx=a.tx-a.fx,vy=a.ty-a.fy;const t=Math.max(0,Math.min(1,((x-a.fx)*vx+(y-a.fy)*vy)/(vx*vx+vy*vy)));
 return Math.hypot(x-a.fx-t*vx,y-a.fy-t*vy)}
function pickAt(x,y){if(!ARW.length)return null;
 const lab=ARW.map((a,i)=>[i,Math.hypot(x-a.lx,y-a.ly)]).filter(p=>p[1]<.3&&ARW[p[0]].label).sort((p,q)=>p[1]-q[1]);
 if(lab.length)return {i:lab[0][0]};                          // 1) ラベル（重ならない位置にある）
 const dc=Math.floor(x),dr=Math.floor(y);if(dc<0||dc>8||dr<0||dr>8)return null;
 // 2) 行き先のマスの中なら距離0、それ以外は矢印の線までの距離。ほかの矢印の線がそのマスを通ることもあるので、
 //    行き先を線より優先せず、同じくらい近い候補が2つあれば決めない（例: 1章の△同飛の線が△２四歩打のマスを通る）
 const sq=sqAt(dr,dc);
 const near=ARW.map((a,i)=>[i,a.to[0]===sq[0]&&a.to[1]===sq[1]?0:segDist(x,y,a)]).filter(p=>p[1]<.3).sort((p,q)=>p[1]-q[1]);
 if(!near.length)return null;
 if(near.length===1||near[1][1]-near[0][1]>=.12)return {i:near[0][0]};
 return {amb:near.filter(p=>p[1]-near[0][1]<.12).map(p=>p[0])}}
function hlOnly(arr){const svg=document.querySelector('.arrows');if(!svg)return;
 svg.querySelectorAll('.arw,.lab').forEach(g=>g.classList.toggle('on',arr.includes(+g.dataset.i)));svg.classList.toggle('dim',arr.length>0)}
function bindPick(n,go){const bd=$('#board');
 const pt=ev=>{const r=bd.getBoundingClientRect();return [(ev.clientX-r.left-bd.clientLeft)/bd.clientWidth*9,(ev.clientY-r.top-bd.clientTop)/bd.clientHeight*9]};
 bd.onclick=ev=>{const res=pickAt(...pt(ev));if(!res)return;
  if(res.amb){hlOnly(res.amb);const e=$('#ambnote');if(e)e.textContent=`${res.amb.map(i=>LETTER[i]).join('と')}が重なっています。丸いラベルか下のボタンで選んでください。`;return}
  go(n.ch[res.i].id)};
 bd.onmousemove=ev=>{const res=pickAt(...pt(ev));const one=res&&res.i!=null;hlOnly(one?[res.i]:res&&res.amb?res.amb:[]);bd.style.cursor=one?'pointer':'default'};
 bd.onmouseleave=()=>hlOnly([])}

// ---- 右のボタン列。[id, 表示, 無効か, 押したとき, 追加クラス]
function tools(list){$('#tools').innerHTML=list.map(([id,lab,dis,,cls])=>`<button class="toolbtn${cls?' '+cls:''}" id="${id}"${dis?' disabled':''}>${lab}</button>`).join('');
 list.forEach(([id,,,fn])=>{$('#'+id).onclick=fn})}

// ---- 章の選択と、済んだ変化の数
let chapHTML='';
function renderMeta(){const h=D.chapters.map(ch=>{const p=progress(ch,ch===C?rec:loadRec(ch));
  return `<option value="${ch.id}"${ch===C?' selected':''}>${esc(ch.name)}（${p.done}/${ch.nleaf}）</option>`}).join('');
 if(h!==chapHTML){$('#chap').innerHTML=h;chapHTML=h}
 const p=progress(C,rec);$('#done').textContent=p.done;$('#nleaf').textContent=C.nleaf}
$('#chap').onchange=e=>openChapter(e.target.value);

const cmtOf=n=>n.c.filter(x=>x!=='基本図');
function cmtHTML(n){const c=cmtOf(n);return c.length?`<div class="cmt">${esc(c.join('\n'))}</div>`:''}
function movesHTML(click){const mv=path.slice(1).map((id,i,a)=>click?`<button class="ply${i===a.length-1?' cur':''}" data-j="${i+2}">${N[id].t}</button>`:`<span class="ply${i===a.length-1?' cur':''}">${N[id].t}</span>`).join('');
 return `<div class="qmeta">手順</div><div class="seq" id="moves">${mv||'<span class="sub">基本図</span>'}</div>`}
function stat(id){const lv=N[id].lv;return {n:lv.length,k:lv.filter(isDone).length}}
function optHTML(n,drill){return n.ch.map((c,i)=>{const s=stat(c.id);
  const right=drill?(s.k>=s.n?'<span class="badge">済</span>':`<small>残り${s.n-s.k}</small>`):`<small>${s.n}変化</small>`;
  return `<button class="opt" data-i="${i}"><span class="lt" style="background:${COLORS[i%COLORS.length]}">${n.ch.length>1?LETTER[i]:'▶'}</span><span class="mvn">${N[c.id].t}</span>${right}</button>`}).join('')}
function bindOpt(n,go){document.querySelectorAll('#pane .opt').forEach(b=>{const i=+b.dataset.i;b.onclick=()=>go(n.ch[i].id);b.onmouseenter=()=>hlOnly([i]);b.onmouseleave=()=>hlOnly([])})}

function render(){renderMeta();
 if(mode==='search'){renderSearch();return}
 const n=cur(),P=parse(n.s),drill=mode==='drill';
 const mine=drill&&myTurn(n)&&n.ch.length>0;
 let hint=null,hintHand=null;if(mine&&hintOn){const c=n.ch[0];if(c.drop)hintHand=c.drop;else hint=c.from.join(',')}
 const last=n.lt?[n.lt.join(','),n.lf?n.lf.join(','):null]:[];
 const show=drill?!myTurn(n)&&n.ch.length>0:n.ch.length>0;
 const arrows=show?n.ch.map((c,i)=>({from:c.from,to:c.to,drop:c.drop?NAME[c.drop]:null,color:COLORS[i%COLORS.length],label:n.ch.length>1?LETTER[i]:''})):[];
 drawBoard(P,{pick:mine,last,hint,hintHand,sel:sel&&sel.k,selHand:sel&&sel.p,arrows});
 if(drill?arrows.length>1:arrows.length>0)bindPick(n,drill?advance:vgo);
 if(mine){document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>clickSq(c.dataset.k));
  document.querySelectorAll('.hp').forEach(b=>b.onclick=()=>{sel=(sel&&sel.p===b.dataset.p)?null:{p:b.dataset.p};render()})}
 if(drill)renderDrill(n,mine);else renderView(n)}

// ---- 練習
const AUTO_MS=500, PICK_SEC=10;
let cd=null, cdLeft=PICK_SEC, resetArm=null;
function renderDrill(n,mine){
 let m=msg;if(!m&&n.ch.length&&mine)m=n.ch.length>1?`あなたの番です（棋譜の手が${n.ch.length}通り）。`:'あなたの番です。';
 const branch=!myTurn(n)&&n.ch.length>1;
 $('#pane').innerHTML=`<div class="situation" id="msg">${m}</div>`+
  (branch?`<div id="opp"><div class="cdwrap"><b id="cdbar" style="width:${cdLeft/PICK_SEC*100}%"></b></div>${optHTML(n,true)}<div class="ng" id="ambnote"></div></div>`:'')+
  movesHTML(false)+cmtHTML(n);
 if(branch)bindOpt(n,advance);
 tools([['hint','ヒント',!mine,showHint],['undo','1手戻る',!path.slice(0,-1).some(id=>myTurn(N[id])),undo],['home','最初から',false,goHome],
  ['find','局面検索',false,openSearch],['reset',resetArm?'もう一度押すと消します':'記録を消す',false,doReset,'sub']])}

function clickSq(k){const n=cur();const P=parse(n.s);const [f,r]=k.split(',').map(Number);const pc=at(P,f,r);
 if(sel&&sel.p){tryMove({drop:sel.p,to:[f,r]});return}
 if(!sel){if(pc&&pc.c===ME){sel={k};render()}return}
 if(k===sel.k){sel=null;render();return}
 if(pc&&pc.c===ME){sel={k};render();return}
 tryMove({from:sel.k.split(',').map(Number),to:[f,r]})}

const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
function tryMove(mv){const n=cur();
 const hits=n.ch.filter(c=>same(c.to,mv.to)&&(mv.drop?c.drop===mv.drop:(!c.drop&&same(c.from,mv.from))));
 sel=null;
 if(!hits.length){wrong();return}
 if(hits.some(c=>c.promoOpt)){pending=hits;$('#promo').style.display='flex';return}
 correct(hits[0])}
function choosePromo(yes){$('#promo').style.display='none';const hits=pending;pending=null;if(!hits)return;
 const c=hits.find(x=>x.promote===yes);if(c)correct(c);else wrong(yes?'この手は成りません。':'この手は成ります。')}
$('#pyes').onclick=()=>choosePromo(true);$('#pno').onclick=()=>choosePromo(false);

function wrong(why){miss++;sErr();if(miss>=2&&!hintOn){hintOn=true;usedHint=true}
 msg=`<span class="ng">棋譜にない手です。</span>${why||''}${hintOn?'光っている駒を動かしてください。':''}`;
 render();const b=$('#board');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
function correct(c){sPlace();miss=0;hintOn=false;msg=`<span class="ok">○ ${N[c.id].t}</span>`;advance(c.id)}

function stopTimers(){clearTimeout(timer);clearInterval(cd);cd=null}
function advance(id){stopTimers();path.push(id);sel=null;arrive()}
// いまの局面に着いたときの処理。相手の番なら自動で指す／候補を選ばせる
function arrive(){const n=cur();
 if(n.ch.length===0){finish();return}
 if(myTurn(n)){render();return}
 if(n.ch.length===1){const c=n.ch[0];msg=(msg?msg+'<br>':'')+`相手：<b>${N[c.id].t}</b>`;render();
  timer=setTimeout(()=>{sPlace();msg='';advance(c.id)},AUTO_MS)}
 else{cdLeft=PICK_SEC;msg=(msg?msg+'<br>':'')+`相手の手を選んでください。<small>（<b id="cdn">${PICK_SEC}</b>秒で自動）</small>`;render();
  cd=setInterval(()=>{cdLeft--;const e=$('#cdn');if(e)e.textContent=cdLeft;const b=$('#cdbar');if(b)b.style.width=(cdLeft/PICK_SEC*100)+'%';
   if(cdLeft<=0){const c=n.ch[Math.floor(Math.random()*n.ch.length)];sPlace();msg=`ランダムで <b>${N[c.id].t}</b>`;advance(c.id)}},1000)}}

function finish(){const n=cur();const l=n.leaf;
 if(l!=null&&!partial){const k=C.lkeys[l],prev=rec[k];if(!usedHint)rec[k]='clean';else if(prev!=='clean')rec[k]='hint';saveRec()}
 sDone();
 msg=(msg?msg+'<br>':'')+`<span class="ok">この変化は完了です。</span>`+
  (partial?'<br><small>途中から練習したので記録していません。</small>':usedHint?'<br><small>ヒントを使ったので「ヒントあり」で記録しました。</small>':'');
 render()}

function showHint(){hintOn=true;usedHint=true;msg='光っている駒を動かしてください。';render()}
function undo(){stopTimers();if(path.length<=1)return;path.pop();while(path.length>1&&!myTurn(cur()))path.pop();
 sel=null;miss=0;hintOn=false;msg='1手戻しました。';if(myTurn(cur()))render();else arrive()}
function goHome(){stopTimers();mode='drill';path=[C.start];sel=null;miss=0;hintOn=false;usedHint=false;partial=false;msg='';pending=null;$('#promo').style.display='none';arrive()}
// 記録を消す（いまの章だけ）: confirm() が使えない環境があるので、ボタンを2回押す方式にする
function doReset(){if(!resetArm){resetArm=setTimeout(()=>{resetArm=null;if(mode==='drill')render()},4000);render();return}
 clearTimeout(resetArm);resetArm=null;rec={};saveRec();msg='この章の学習記録を消しました。';render()}
function setChapter(id){C=D.chapters.find(c=>c.id===id)||D.chapters[0];N=C.nodes;ME=C.side;OPP=ME==='b'?'w':'b';rec=loadRec(C);
 lsSet('migishiken_drill_v2:last',C.id);try{history.replaceState(null,'','#'+C.id)}catch(e){}}
function openChapter(id){setChapter(id);goHome()}

// ---- 局面検索（部分図）: 条件を置いたマスだけを全章の局面と比べる。持駒と手番は比べない
const PAL=['K','R','B','G','S','N','L','P','+R','+B','+P'];
// 局面の駒のあるマスを全部条件にする（空きのマスは比べない）
function patFrom(sfen){const P=parse(sfen);pat={};for(let f=1;f<=9;f++)for(let r=1;r<=9;r++){const pc=at(P,f,r);if(pc)pat[f+','+r]=pc.c+':'+pc.p}}
// 検索を開くと、いまの章の基本図から始める
function openSearch(){stopTimers();searchBase=cur().s;patFrom(N[C.start].s);mode='search';sel=null;pending=null;$('#promo').style.display='none';render()}
function searchHits(){const keys=Object.keys(pat);if(!keys.length)return null;
 const sq=keys.map(k=>[k.split(',').map(Number),pat[k]]);const out=[];
 D.chapters.forEach(ch=>{const seen=new Set();
  ch._order.forEach(id=>{const n=ch.nodes[id];const P=ch._P[id]||(ch._P[id]=parse(n.s));
   if(!sq.every(([[f,r],v])=>{const pc=at(P,f,r);return v==='empty'?!pc:!!pc&&pc.c+':'+pc.p===v}))return;
   const key=n.s.split(' ').slice(0,3).join(' ');if(seen.has(key))return;seen.add(key);out.push({ch,id})})});
 return out}
function renderSearch(){
 drawBoard(null,{pat});
 document.querySelectorAll('.cell').forEach(c=>{c.classList.add('pick');c.onclick=()=>{const k=c.dataset.k;
  if(palV===''||pat[k]===palV)delete pat[k];else pat[k]=palV;render()}});
 const pb=(v,lab,cls)=>`<button class="pbtn ${cls}${palV===v?' on':''}" data-v="${v}">${lab}</button>`;
 const row=c=>`<div class="row"><span>${MARK[c]}</span>${PAL.map(p=>pb(c+':'+p,`<span class="${c===ME?'':'rot'}">${NAME[p]}</span>`,c)).join('')}</div>`;
 const hits=searchHits();let res;
 if(!hits)res='<div class="none">盤に駒（または「空き」）を置くと、一致する局面が出ます。</div>';
 else if(!hits.length)res='<div class="none">一致する局面はありません。</div>';
 else res=`<div class="qmeta">一致した局面 ${hits.length}件</div>`+hits.slice(0,60).map(({ch,id})=>{const n=ch.nodes[id];
  const mv=[];let x=id;while(x!=null&&x!==ch.start&&mv.length<4){mv.unshift(ch.nodes[x].t);x=ch.nodes[x].par}
  const more=x!=null&&x!==ch.start?'… ':'';
  return `<button class="res" data-c="${ch.id}" data-id="${id}"><b>${esc(ch.name)}</b>　${id===ch.start?'基本図':n.p+'手目'}・この先${n.lv.length}変化<span class="mvs" style="display:block">${mv.length?more+mv.join(' '):'（基本図）'}</span></button>`}).join('')+
  (hits.length>60?`<div class="none">ほか ${hits.length-60}件。条件を足して絞ってください。</div>`:'');
 $('#pane').innerHTML=`<div class="situation"><span class="tag">局面検索</span>駒を選んで盤のマスを押す（置いたマスだけ比べる）</div>
  <div class="pal">${row(ME)}${row(OPP)}<div class="row"><span></span>${pb('empty','空き','txt')}${pb('','消す','txt')}</div></div><div id="results">${res}</div>`;
 document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{palV=b.dataset.v;render()});
 document.querySelectorAll('.res').forEach(b=>b.onclick=()=>openView(b.dataset.c,+b.dataset.id));
 tools([['fbase','基本図',false,()=>{patFrom(N[C.start].s);render()}],['fcur','今の局面',false,()=>{patFrom(searchBase);render()}],
  ['fclr','全部消す',!Object.keys(pat).length,()=>{pat={};render()}],['back','練習に戻る',false,()=>openChapter(C.id)]])}

// ---- 閲覧: 検索結果の局面から、両方の手を自由に進めて変化を見る
function pathTo(id){const p=[];let x=id;while(x!=null){p.unshift(x);if(x===C.start)break;x=N[x].par}return p}
function openView(chId,id){stopTimers();setChapter(chId);path=pathTo(id);mode='view';sel=null;render()}
function vgo(id){path.push(id);render()}
function renderView(n){
 const head=n.ch.length?`${path.length===1?'基本図':n.p+'手目'}・次は${MARK[turnOf(n)]}の番`:`この変化はここまで（${n.p}手目）`;
 let vars='';
 if(n.ch.length){const ls=n.lv.map(l=>{const id=C._leafNode[l];const ids=[];let x=id;while(x!==path[path.length-1]){ids.unshift(x);x=N[x].par}
   return {id,txt:ids.map(i=>N[i].t).join(' '),cm:cmtOf(N[id]).join(' / '),done:isDone(l)}});
  vars=`<div class="qmeta">この先の変化 ${ls.length}本</div>`+ls.map(v=>`<button class="var" data-id="${v.id}"><span class="mvs">${v.txt}</span>${v.cm||v.done?`<small>${v.done?'済　':''}${esc(v.cm)}</small>`:''}</button>`).join('')}
 $('#pane').innerHTML=`<div class="situation"><span class="tag">閲覧</span>${esc(C.name)}　${head}</div>`+
  (n.ch.length?optHTML(n,false)+'<div class="ng" id="ambnote"></div>':'')+movesHTML(true)+cmtHTML(n)+vars;
 bindOpt(n,vgo);
 document.querySelectorAll('#moves .ply').forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.j);render()});
 document.querySelectorAll('.var').forEach(b=>b.onclick=()=>{path=pathTo(+b.dataset.id);render()});
 tools([['vprev','◀ 戻る',path.length<=1,()=>{path.pop();render()}],['vnext','▶ 進む',!n.ch.length,()=>vgo(n.ch[0].id)],
  ['vplay','ここから練習',!n.ch.length,()=>{mode='drill';sel=null;miss=0;hintOn=false;usedHint=false;partial=path.length>1;msg='';arrive()}],
  ['vres','検索結果',false,()=>{searchBase=cur().s;mode='search';render()}],['back','練習に戻る',false,()=>openChapter(C.id)]])}

// ---- 盤の大きさ（ビューアと同じ計算）
function sizeBoard(){
 const vv=window.visualViewport;
 const w=(vv&&vv.width)||window.innerWidth;
 const h=(vv&&vv.height)||window.innerHeight;
 const twoCol=w>820;
 const availH=(twoCol?h:h*0.60)-120;
 const byH=availH/9.23;
 const availW=(twoCol?w*0.50:w*0.96)-120;
 const byW=availW/9.7;
 const cell=Math.max(22,Math.min(80,Math.floor(Math.min(byH,byW))));
 document.documentElement.style.setProperty("--cell",cell+"px");
 document.documentElement.style.setProperty("--bw",(cell*10)+"px");
}
window.addEventListener("resize",sizeBoard);
window.addEventListener("orientationchange",()=>setTimeout(sizeBoard,80));
if(window.visualViewport)window.visualViewport.addEventListener("resize",sizeBoard);
sizeBoard();setTimeout(sizeBoard,60);
openChapter((location.hash||'').slice(1)&&D.chapters.some(c=>c.id===location.hash.slice(1))?location.hash.slice(1):(lsGet('migishiken_drill_v2:last')||D.chapters[0].id));
</script></body></html>
