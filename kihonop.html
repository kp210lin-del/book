<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>序盤の基本</title>
<style>
:root{
  --bg:#1f2430; --panel:#2a3140; --line:#3a4150; --ink:#eef2f7;
  --sub:#9aa7bd; --accent:#e0853a; --ok:#46b46b; --bad:#d9534f;
  --board:#e8c479; --grid:#7a5a22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
a{color:inherit;text-decoration:none}

header{display:flex;gap:10px;align-items:center;padding:8px 12px;
  background:#171b24;border-bottom:1px solid #000;position:sticky;top:0;z-index:5}
header .back{font-size:16px;padding:8px 12px;border-radius:10px;background:#2a3140}
header .title{font-size:18px;font-weight:700}
.counter{margin-left:auto;font-size:15px;color:var(--sub);white-space:nowrap}
.counter b{color:var(--ink);font-size:18px}
.wrap{display:flex;gap:14px;padding:14px;align-items:flex-start;max-width:1100px;margin:0 auto}
.left{flex:1 1 0;min-width:0}
.right{flex:0 0 auto}
.boardbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.turn{font-size:16px;color:var(--sub)}
.turn b{color:var(--accent)}
table.board{border-collapse:collapse;background:var(--board);
  box-shadow:0 6px 20px rgba(0,0,0,.45);border:3px solid var(--grid)}
table.board td{width:var(--cell);height:var(--cell);border:1px solid var(--grid);
  text-align:center;vertical-align:middle;padding:0;
  font-size:calc(var(--cell)*.72);line-height:1;font-weight:600;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
td.g span{display:inline-block;transform:rotate(180deg)}
td.s{color:#1b1b1b} td.g{color:#1b1b1b}
.coordsrow td{font-size:calc(var(--cell)*.34);color:#6b5320;font-family:sans-serif;
  height:auto;border:none;background:transparent;font-weight:700}
.coordcol{font-size:calc(var(--cell)*.34);color:#6b5320;font-family:sans-serif;
  font-weight:700;padding:0 3px;border:none;background:transparent}
.hands{display:flex;flex-direction:column;gap:4px;width:100%;max-width:var(--bw)}
.hand{display:flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid #000;border-radius:8px;padding:6px 10px;font-size:17px;min-height:34px}
.hand .lab{color:var(--sub);font-size:13px;flex:0 0 auto}
.hand .pc{font-family:"Hiragino Mincho ProN",serif}
.qmeta{font-size:13px;color:var(--sub);margin-bottom:6px}
.situation{background:var(--panel);border:1px solid #000;border-radius:12px;
  padding:14px;font-size:17px;line-height:1.55;margin-bottom:12px}
.btnrow{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
button.big{flex:1 1 auto;font-size:19px;font-weight:700;padding:16px;border-radius:14px;
  border:none;background:var(--accent);color:#1b1b1b;min-height:56px}
button.nav{background:#39414f;color:var(--ink)}
button.big:active{filter:brightness(.9)}
.answer{display:none;background:var(--panel);border:1px solid #000;border-radius:12px;
  padding:14px;font-size:17px;line-height:1.6}
.answer.show{display:block}
.ans-h{font-size:14px;color:var(--sub);margin-bottom:8px}
.movebig{font-size:30px;font-weight:800;color:var(--accent);font-family:"Hiragino Mincho ProN",serif}
.choice{border:1px solid #3a4150;border-radius:10px;padding:10px 12px;margin:8px 0}
.choice.correct{border-color:var(--ok);background:rgba(70,180,107,.12)}
.choice .mv{font-size:20px;font-weight:700}
.choice .tag{float:right;font-size:13px;padding:2px 8px;border-radius:20px;background:#39414f}
.choice.correct .tag{background:var(--ok);color:#08240f}
.choice .ex{margin-top:6px;font-size:15px;color:#d4dbe8}
.seq{font-size:19px;line-height:1.9;font-family:"Hiragino Mincho ProN",serif}
.seq .ply{display:inline-block;padding:2px 8px;margin:2px;border-radius:8px;background:#39414f}
.seq .hisshi{background:var(--bad);color:#fff;font-weight:700}
.wrongseq{margin-top:10px;font-size:16px;color:var(--sub)}
.note{margin-top:10px;font-size:13px;color:var(--sub)}
.kind{display:inline-block;font-size:13px;padding:3px 10px;border-radius:20px;
  background:var(--accent);color:#1b1b1b;font-weight:700;margin-bottom:8px}
.jump{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px;color:var(--sub)}
.jump input{width:80px;font-size:18px;padding:8px;border-radius:8px;border:1px solid #000;
  background:#2a3140;color:var(--ink);text-align:center}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:center}
  .left{width:100%;order:2}
  .right{order:1;width:100%;display:flex;justify-content:center}
}
</style></head><body>
<header>
  <a class="back" href="index.html">☰ 一覧</a>
  <span class="title">序盤の基本</span>
  <div class="counter">第 <b id="curNo">1</b> 問 / <span id="total">0</span></div>
</header>
<div class="wrap">
  <div class="left">
    <div class="qmeta" id="qmeta"></div>
    <div class="situation" id="situation"></div>
    <div class="btnrow"><button class="big" id="showBtn">解答を見る</button></div>
    <div class="answer" id="answer"></div>
    <div class="btnrow" style="margin-top:14px">
      <button class="big nav" id="prevBtn">◀ 前の問題</button>
      <button class="big nav" id="nextBtn">次の問題 ▶</button>
    </div>
    <div class="jump">問題番号へ <input type="number" id="jumpInp" min="1">
      <button class="nav" style="padding:8px 14px;border-radius:8px;border:none;color:#fff" id="jumpBtn">移動</button></div>
  </div>
  <div class="right"><div class="boardbox">
    <div class="turn" id="turnLbl"></div>
    <div class="hands"><div class="hand"><span class="lab">後手 持駒</span><span class="pc" id="goteHandPc">なし</span></div></div>
    <div id="boardHost"></div>
    <div class="hands"><div class="hand"><span class="lab">先手 持駒</span><span class="pc" id="senteHandPc">なし</span></div></div>
  </div></div>
</div>

    if(/[0-9]/.test(ch)){n+=ch;continue;}
    const cnt=n?+n:1;n="";const up=ch.toUpperCase();
    const side=ch===up?"s":"g";hands[side][up]=(hands[side][up]||0)+cnt;}}
  return {grid,turn,hands};
}
function renderBoard(host,sfen){
  const {grid,turn,hands}=parseSfen(sfen);
  let h='<table class="board"><tr class="coordsrow">';
  for(let f=9;f>=1;f--)h+=`<td>${f}</td>`;h+='<td></td></tr>';
  for(let r=0;r<9;r++){h+='<tr>';
    for(let f=0;f<9;f++){const p=grid[r][f];
      if(!p){h+='<td></td>';continue;}
      const up=p.replace("+","").toUpperCase();
      const base=(p[0]==="+"?"+":"")+up;
      const isGote=p.replace("+","")===p.replace("+","").toLowerCase();
      h+=`<td class="${isGote?'g':'s'}"><span>${PIECE_JP[base]||"?"}</span></td>`;}
    h+=`<td class="coordcol">${KAN_NUM[r+1]}</td></tr>`;}
  h+='</table>';host.innerHTML=h;
  document.getElementById("senteHandPc").textContent=handText(hands.s);
  document.getElementById("goteHandPc").textContent=handText(hands.g);
  document.getElementById("turnLbl").innerHTML="手番 <b>"+(turn==="b"?"▲先手":"△後手")+"</b>";
}
function handText(h){const a=[];for(const p of HAND_ORDER)if(h[p])a.push(PIECE_JP[p]+(h[p]>1?h[p]:""));return a.length?a.join(" "):"なし";}
function cloneState(sfen){const s=parseSfen(sfen);
  return {grid:s.grid.map(r=>r.slice()),hands:{s:{...s.hands.s},g:{...s.hands.g}},turn:s.turn};}
function sqToRC(sq){const file=+sq[0],rank=RANK_L.indexOf(sq[1]);return {r:rank,c:9-file,file};}
function usiToJp(state,usi,prevDest){
  const black=state.turn==="b",mark=black?"▲":"△";
  let dest,jp,isDrop=usi.includes("*"),promote=usi.endsWith("+");
  if(isDrop){const piece=usi[0];dest=usi.slice(2,4).replace("+","");const d=sqToRC(dest);
    jp=mark+ZEN_NUM[d.file]+KAN_NUM[d.r+1]+PIECE_JP[piece]+"打";
    state.grid[d.r][d.c]=black?piece:piece.toLowerCase();state.hands[black?"s":"g"][piece]--;
  }else{const from=usi.slice(0,2),to=usi.slice(2,4);const f=sqToRC(from),t=sqToRC(to);
    let mover=state.grid[f.r][f.c]||"P";const baseUp=mover.replace("+","").toUpperCase();
    const isSame=prevDest&&prevDest===to;
    const pieceName=(mover[0]==="+")?PIECE_JP["+"+baseUp]:PIECE_JP[baseUp];
    const sq=isSame?"同":ZEN_NUM[t.file]+KAN_NUM[t.r+1];
    jp=mark+sq+pieceName+(promote?"成":"");
    const cap=state.grid[t.r][t.c];
    if(cap){const cu=cap.replace("+","").toUpperCase();state.hands[black?"s":"g"][cu]=(state.hands[black?"s":"g"][cu]||0)+1;}
    let np=mover;if(promote)np=(mover[0]==="+"?mover:"+"+mover);
    state.grid[t.r][t.c]=np;state.grid[f.r][f.c]=null;}
  state.turn=black?"w":"b";return {jp,dest:usi.slice(2,4).replace("+","")};
}
function renderSeq(sfen,moves){const st=cloneState(sfen);let prev=null;const out=[];
  for(const m of moves){const r=usiToJp(st,m,prev);out.push(r.jp);prev=r.dest;}return out;}

let curIdx=0;
const POSKEY="shogibook_pos_"+BOOK_SLUG;
function savePos(){try{localStorage.setItem(POSKEY,curIdx);}catch(e){}}
function loadPos(){try{const v=+localStorage.getItem(POSKEY);if(v>=0&&v<DATA.length)curIdx=v;}catch(e){}}
function render(){
  const p=DATA[curIdx];
  document.getElementById("curNo").textContent=p.problem_no;
  document.getElementById("qmeta").textContent=p.book+(p.label?(" / "+p.label):(p.chapter?(" / "+p.chapter):""));
  const sit=document.getElementById("situation");
  if(p.situation){sit.style.display="block";sit.textContent=p.situation;}else sit.style.display="none";
  renderBoard(document.getElementById("boardHost"),p.sfen);
  const ans=document.getElementById("answer");ans.classList.remove("show");
  document.getElementById("showBtn").textContent="解答を見る";
  ans.innerHTML=buildAnswer(p,p.answer);
  document.getElementById("jumpInp").value=p.problem_no;savePos();
}
function buildAnswer(p,a){
  if(!a)return "<div class='ans-h'>解答データなし</div>";
  if(a.type==="final_move"){let s="<div class='ans-h'>解答手順の最終手</div>";
    s+="<div class='movebig'>"+a.move_jp+" まで</div>";
    s+="<div class='note'>※ これは正解手順の<b>最終手</b>です（初手・全手順はこの書籍では未収録）。</div>";
    if(a.incomplete)s+="<div class='note'>※ 原典キャプションの表記欠損で着地マスが特定できません。</div>";return s;}
  if(a.type==="single"){const jp=renderSeq(p.sfen,[a.usi])[0];
    return "<div class='ans-h'>正解（次の一手）</div><div class='movebig'>"+jp+"</div>";}
  if(a.type==="choice"){let s="<div class='ans-h'>選択肢</div>";
    for(const c of a.choices){const ok=c.label===a.correct;
      s+="<div class='choice"+(ok?" correct":"")+"'><span class='tag'>"+c.label+(ok?" ◎正解":"")+"</span>";
      s+="<div class='mv'>"+c.move_jp+"</div>";if(c.explanation)s+="<div class='ex'>"+c.explanation+"</div>";s+="</div>";}
    return s;}
  if(a.type==="sequence"){let s="";if(a.kind)s+="<span class='kind'>"+a.kind+"</span>";
    s+="<div class='ans-h'>正解手順</div>";
    (a.sequences||[]).forEach((seq,si)=>{const jps=renderSeq(p.sfen,seq);const hi=(a.hisshi_index||[])[si];
      s+="<div class='seq'>";jps.forEach((mv,k)=>{const isH=(hi!==undefined&&k===hi);
        s+="<span class='ply"+(isH?" hisshi":"")+"'>"+(k+1)+". "+mv+"</span>";});s+="</div>";});
    if(a.wrong_sequences&&a.wrong_sequences.length){s+="<div class='wrongseq'><div class='ans-h'>紛れ（不正解）</div>";
      a.wrong_sequences.forEach(seq=>{const jps=renderSeq(p.sfen,seq);
        s+="<div class='seq' style='opacity:.75'>"+jps.map((m,i)=>"<span class='ply'>"+(i+1)+". "+m+"</span>").join("")+"</div>";});s+="</div>";}
    return s;}
  return "<div class='ans-h'>（解答未収録）</div>";
}
function go(n){curIdx=Math.max(0,Math.min(n,DATA.length-1));render();}
document.getElementById("prevBtn").onclick=()=>go(curIdx-1);
document.getElementById("nextBtn").onclick=()=>go(curIdx+1);
document.getElementById("showBtn").onclick=()=>{const a=document.getElementById("answer");
  a.classList.toggle("show");document.getElementById("showBtn").textContent=a.classList.contains("show")?"解答を隠す":"解答を見る";};
document.getElementById("jumpBtn").onclick=()=>{const v=+document.getElementById("jumpInp").value;
  const i=DATA.findIndex(p=>p.problem_no===v);if(i>=0)go(i);};
document.getElementById("jumpInp").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("jumpBtn").click();});
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){if(dx<0)go(curIdx+1);else go(curIdx-1);}},{passive:true});
function sizeBoard(){
  const w=window.innerWidth,h=window.innerHeight;
  const twoCol=w>820;
  // 盤(9マス)を画面の約半分に。横持ち=幅の半分、縦持ち=幅いっぱい寄り
  const avail=twoCol?Math.min(w*0.5,h*0.86):Math.min(w*0.94,h*0.62);
  const cell=Math.max(30,Math.min(80,Math.floor(avail/9)));
  document.documentElement.style.setProperty("--cell",cell+"px");
  document.documentElement.style.setProperty("--bw",(cell*10)+"px");}
window.addEventListener("resize",sizeBoard);
document.getElementById("total").textContent=DATA.length;
loadPos();sizeBoard();render();setTimeout(sizeBoard,60);

</script></body></html>
