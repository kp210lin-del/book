<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>将之棒銀の巻</title>
<style>
/* 盤・持駒欄・ボタン列は右四間飛車（migishiken_template.html）と共通。技名の演出は将之次の一手（tsugi.html）から */
:root{
  --bg:#1f2430; --panel:#2a3140; --line:#3a4150; --ink:#eef2f7;
  --sub:#9aa7bd; --accent:#e0853a; --ok:#46b46b; --bad:#d9534f;
  --board:#e8c479; --grid:#7a5a22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px;
  padding-bottom:8px;border-bottom:1px solid #333}
.meta .back{font-size:15px;padding:8px 12px;border-radius:10px;background:#2a3140}
.meta .bktitle{font-size:19px;font-weight:700}
.meta select{font-size:15px;padding:7px 8px;border-radius:10px;border:1px solid #000;
  background:var(--panel);color:var(--ink);max-width:100%}
.meta .counter{font-size:15px;color:var(--sub);white-space:nowrap}
.meta .counter b{color:var(--ink);font-size:20px}
.meta .exambtn{font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid #000;background:#39414f;color:var(--sub);font-weight:700}
.meta .exambtn.on{background:var(--accent);color:#1b1b1b}
.meta .exambtn.pass{background:var(--ok);color:#08240f}
.wrap{display:flex;gap:14px;padding:10px;align-items:stretch;max-width:1600px;margin:0 auto;
  height:100dvh;max-height:100dvh;overflow:hidden}
.left{flex:1 1 calc(var(--bw) + 48px);min-width:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.right{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.boardbox{display:flex;flex-direction:column;align-items:center;gap:5px}
.boardrow{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%}
.boardwrap{position:relative}
.boardtools{display:flex;flex-direction:column;gap:8px;width:108px}
.toolbtn{width:100%;padding:10px 8px;border-radius:10px;border:1px solid #000;
  background:#39414f;color:var(--ink);font-size:15px;font-weight:700;min-height:44px}
.toolbtn.active{background:var(--accent);color:#1b1b1b}
.toolbtn.sub{font-size:12px;font-weight:600;min-height:36px;color:var(--sub);background:#2f3644}
.toolbtn:disabled{opacity:.45;cursor:default}
.promobox{display:none;flex-direction:column;gap:10px;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);z-index:20;background:rgba(20,24,32,.95);
  border:2px solid var(--accent);border-radius:14px;padding:18px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.55);min-width:160px}
.promolabel{font-size:15px;color:var(--ink);text-align:center;font-weight:700}
.promobtn{width:100%;padding:12px 8px;border-radius:10px;border:1px solid #000;
  background:#5d6a82;color:var(--ink);font-size:17px;font-weight:700;min-height:48px}
/* 盤 */
.board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,var(--cell));
  gap:1px;background:var(--grid);border:3px solid var(--grid);box-shadow:0 6px 20px rgba(0,0,0,.45);
  position:relative;user-select:none;-webkit-user-select:none}
.cell{background:var(--board);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell)*.72);line-height:1;font-weight:600;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.cell.b{color:#16407a} .cell.w{color:#a32a2a}
.rot{display:inline-block;transform:rotate(180deg)}
.cell.pick{cursor:pointer}
.cell.last{background:#f0bf7e}
.cell.sel{background:#f3a764;box-shadow:inset 0 0 0 3px var(--accent)}
.cell.hint{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:inset 0 0 0 3px rgba(255,214,64,.4);background-color:#efd68a}
  to{box-shadow:inset 0 0 0 4px rgba(255,214,64,1),0 0 14px rgba(255,214,64,.9);background-color:#ffe27a}}
.cell.glow{animation:pika .9s ease-out}
.cell.glow span{animation:pikaT .9s ease-out}
@keyframes pika{0%{background:#fffdf0;box-shadow:inset 0 0 0 4px #fff,0 0 24px 8px rgba(255,235,120,.95)}
  100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 0 transparent}}
@keyframes pikaT{0%{filter:brightness(2.4) drop-shadow(0 0 10px #ffe680)}100%{filter:none}}
.board.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arrows g{opacity:.9;transition:opacity .15s}.arrows g.on{opacity:1}.arrows g.on .shaft{stroke-width:.2}
.arrows.dim g:not(.on){opacity:.25}
.brd{display:inline-block}
.files{display:flex;padding-left:3px}
.files i{width:calc(var(--cell) + 1px);text-align:center;font-style:normal;font-weight:700;
  font-size:calc(var(--cell)*.23);color:var(--sub);font-family:sans-serif;padding-bottom:3px}
.bmid{display:flex;align-items:flex-start}
.ranks{display:flex;flex-direction:column;padding-top:3px}
.ranks i{height:calc(var(--cell) + 1px);display:flex;align-items:center;justify-content:center;
  width:calc(var(--cell)*.62);font-style:normal;font-weight:700;
  font-size:calc(var(--cell)*.23);color:var(--sub);font-family:sans-serif}
.hands{display:flex;flex-direction:column;gap:4px;width:100%;max-width:var(--bw)}
.hand{display:flex;align-items:flex-start;gap:8px;background:var(--panel);
  border:1px solid #000;border-radius:10px;padding:8px 10px;font-size:17px;min-height:56px}
.hand .lab{color:var(--sub);font-size:13px;flex:0 0 auto;padding-top:5px}
.hand .pc{display:flex;flex-wrap:wrap;gap:8px}
.handbtn{min-width:44px;min-height:40px;padding:4px 8px;border-radius:10px;border:1px solid #000;
  background:#485164;color:var(--ink);font-size:24px;line-height:1;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;display:inline-flex;align-items:center;justify-content:center}
.handbtn small{font-size:14px;margin-left:2px}
.handbtn.ro{cursor:default}
.handbtn.sel{background:var(--accent);color:#1b1b1b}
.handbtn.hint{animation:glow 1s infinite alternate;color:#1b1b1b}
.handempty{font-size:15px;color:var(--sub);padding-top:7px}
/* 技名の演出（将之次の一手と同じ） */
.flash{display:none;position:absolute;inset:0;z-index:15;align-items:center;justify-content:center;
  flex-direction:column;pointer-events:none;text-align:center;overflow:hidden;border-radius:6px;
  background:radial-gradient(ellipse at center,rgba(40,24,6,.9) 0%,rgba(14,10,6,.86) 70%)}
.flash::before,.flash::after{content:"";position:absolute;left:-10%;right:-10%;height:3px;
  background:linear-gradient(90deg,transparent,#ffd966 20%,#fff3b0 50%,#ffd966 80%,transparent);
  box-shadow:0 0 12px #ffcc33}
.flash::before{top:30%;transform:translateX(-100%);animation:sweep .35s .03s ease-out forwards}
.flash::after{bottom:30%;transform:translateX(100%);animation:sweepr .35s .03s ease-out forwards}
.flash.show{display:flex;animation:flashout 1.7s forwards}
.flash .m{font-size:calc(var(--cell)*.42);font-weight:700;color:#ffe9a8;letter-spacing:.5em;margin-bottom:calc(var(--cell)*.1);
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;opacity:0;animation:fadein .25s .22s forwards}
.flash .t{font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;font-weight:900;
  font-size:calc(var(--cell)*1.0);letter-spacing:.06em;padding:0 10px;line-height:1.25;
  background:linear-gradient(180deg,#fffbe0 0%,#ffd75e 45%,#e09a1a 55%,#ffe58a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,50,0,.9)) drop-shadow(0 0 14px rgba(255,190,50,.75));
  animation:slam .35s .05s cubic-bezier(.2,1.4,.4,1) both}
.flash .sub{margin-top:calc(var(--cell)*.14);font-size:calc(var(--cell)*.3);color:#ffd9a0;letter-spacing:.3em;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;opacity:0;animation:fadein .25s .35s forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.2) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes sweep{to{transform:translateX(0)}}
@keyframes sweepr{to{transform:translateX(0)}}
@keyframes fadein{to{opacity:1}}
@keyframes flashout{0%{opacity:0}9%{opacity:1}72%{opacity:1}100%{opacity:0}}
.pop{position:absolute;z-index:12;pointer-events:none;white-space:nowrap;translate:-50% 0;
  font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;font-weight:900;
  font-size:calc(var(--cell)*.4);letter-spacing:.04em;
  background:linear-gradient(180deg,#fffbe0 0%,#ffd75e 48%,#e09a1a 58%,#ffe58a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(60,30,0,.95)) drop-shadow(0 0 8px rgba(255,190,50,.8));
  animation:popin 1.4s ease-out forwards}
.pop.up{translate:-50% -100%}
@keyframes popin{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.12)}26%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
/* 左カラム */
.qmeta{font-size:13px;color:var(--sub);margin:10px 0 4px}
.situation{background:var(--panel);border:1px solid #000;border-radius:12px;
  padding:10px 12px;font-size:17px;line-height:1.6;margin-bottom:8px;min-height:48px}
.situation small{color:var(--sub);font-size:13px}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--bad);font-weight:700}
.wzname{color:#ffd75e;font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--accent);
  color:#1b1b1b;font-weight:700;margin-right:8px;vertical-align:1px}
.cdwrap{height:6px;background:#39414f;border-radius:4px;overflow:hidden;margin:2px 0 6px}
.cdwrap b{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 6px;
  padding:9px 12px;border-radius:10px;border:1px solid #000;background:#39414f;color:var(--ink);font-size:18px}
.opt .mvn{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;flex:1}
.opt small{font-size:13px;color:var(--sub)}
.lt{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  color:#fff;font-size:14px;font-weight:700;flex:0 0 auto}
.badge{font-size:12px;padding:1px 8px;border-radius:20px;background:var(--ok);color:#08240f;font-weight:700}
#ambnote{font-size:14px;min-height:0}
.wz{display:flex;flex-wrap:wrap;gap:6px}
.wz span{font-size:14px;padding:3px 10px;border-radius:20px;background:#4a3d1e;color:#ffd75e;font-weight:700;border:1px solid #6b5520}
.bigbtn{display:block;width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);
  color:#1b1b1b;font-size:17px;font-weight:700;margin:6px 0;min-height:48px}
.bigbtn.ghost{background:#39414f;color:var(--ink)}
.seq{font-size:17px;line-height:1.9;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.seq .ply{display:inline-block;padding:1px 7px;margin:2px;border-radius:8px;background:#39414f;border:0;color:var(--ink);font:inherit}
.seq .ply.cur{background:var(--accent);color:#1b1b1b}
.seq .ply.w{box-shadow:inset 0 0 0 2px #c9a030}
.seq .sub{color:var(--sub);font-size:14px;font-family:sans-serif}
.cmt{background:var(--panel);border:1px solid #000;border-radius:12px;padding:10px 12px;margin-top:10px;
  font-size:15px;line-height:1.6;white-space:pre-wrap;color:#d4dbe8}
/* 結果（挑戦モードの合否） */
.sheet{display:none;position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.72);align-items:center;justify-content:center}
.sheet.show{display:flex}
.sheetbox{background:var(--panel);border:1px solid #000;border-radius:14px;padding:16px;
  width:min(92vw,440px);max-height:82vh;overflow-y:auto;text-align:center}
.sheetbox h3{margin:0 0 10px;font-size:20px}
.sheetbox p{margin:6px 0 14px;font-size:16px;line-height:1.6;color:var(--sub)}
.sheetbox .big{font-size:44px;font-weight:800;margin:4px 0}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:stretch;gap:6px}
  .right{order:1;width:100%;flex:0 0 auto}
  .left{order:2;width:100%;flex:1 1 auto;min-height:0;height:auto;overflow-y:auto}
  .boardtools{width:96px}
  .toolbtn{font-size:14px;min-height:40px;padding:8px 6px}
  .hand{min-height:48px;padding:5px 8px}
  .handbtn{min-height:36px;font-size:21px}
}
</style></head><body>

  <div class="left">
    <div class="meta">
      <a class="back" href="index.html">☰ 一覧</a>
      <div class="bktitle">将之棒銀の巻</div>
      <select id="chap" aria-label="章"></select>
      <div class="counter">済 <b id="done">0</b> / <span id="nleaf">0</span></div>
      <button class="exambtn" id="examBtn">挑戦モード</button>

    <div id="pane"></div>

      <div class="boardwrap">
        <div id="bd"></div>
        <div class="promobox" id="promo">
          <div class="promolabel">成りますか？</div>
          <button class="promobtn" id="pyes">成る</button>
          <button class="promobtn" id="pno">成らず</button>

        <div class="flash" id="flash"><div class="m">技</div><div class="t" id="flashTag"></div><div class="sub">きまった！</div></div>
      </div>
      <div class="boardtools" id="tools"></div>
    </div>
    <div class="hands"><div class="hand" id="handBot"></div></div>
  </div></div>
</div>
<div class="sheet" id="result"><div class="sheetbox"><div class="big" id="resMark"></div>
  <h3 id="resTitle"></h3><p id="resText"></p>
  <button class="bigbtn" id="res1"></button><button class="bigbtn ghost" id="res2"></button></div></div>

 [523,659,784,1047].forEach(f=>brass(f,1.1,.1,.62));[1568,1976,2349,3136].forEach((f,k)=>tone(f,.6,'triangle',.06,.7+k*.08));noise(.9,6500,1,.15,.62,'highpass')};

// ---- 状態。mode: drill=練習 / exam=挑戦
let mode='drill';
let path=[], sel=null, miss=0, hintOn=false, usedHint=false, busy=false, timer=null, msg='', pending=null;
let hintT=[], hintNode=null, EX=null, flashN=0;
const AUTO_MS=500, PICK_SEC=10, FLASH_MS=1800, HINT1=10000, HINT2=20000, EXAM_N=3;
const cur=()=>N[path[path.length-1]];
const turnOf=n=>n.s.split(' ')[1];
const myTurn=n=>turnOf(n)===ME;

const sqAt=(dr,dc)=>ME==='w'?[dc+1,9-dr]:[9-dc,dr+1];
const pieceHTML=pc=>`<span class="${pc.c===ME?'':'rot'}">${NAME[pc.p]}</span>`;
function boardHTML(P,o){let cells='';
 for(let dr=0;dr<9;dr++)for(let dc=0;dc<9;dc++){const [f,r]=sqAt(dr,dc);const k=f+','+r;
  let cls='cell',inner='';const pc=at(P,f,r);
  if(pc){cls+=' '+pc.c;inner=pieceHTML(pc)}
  if(o.last&&o.last.includes(k))cls+=' last';if(o.hint===k)cls+=' hint';if(o.sel===k)cls+=' sel';if(o.pick)cls+=' pick';
  cells+=`<div class="${cls}" data-k="${k}">${inner}</div>`}
 let files='',ranks='';for(let i=0;i<9;i++){files+=`<i>${ME==='w'?i+1:9-i}</i>`;ranks+=`<i>${KN[ME==='w'?9-i:i+1]}</i>`}
 return `<div class="brd"><div class="files">${files}</div><div class="bmid"><div class="board" id="board">${cells}${arrowsSVG(o.arrows||[])}</div><div class="ranks">${ranks}</div></div></div>`}
function handHTML(P,c,click,o){
 const items=HORDER.split('').filter(p=>P.h[c][p]).map(p=>{const n=P.h[c][p];const inner=`<span class="${c===ME?'':'rot'}">${NAME[p]}</span>${n>1?`<small>${n}</small>`:''}`;
  return click?`<button class="handbtn hp${o.selHand===p?' sel':''}${o.hintHand===p?' hint':''}" data-p="${p}">${inner}</button>`:`<span class="handbtn ro">${inner}</span>`}).join('');
 return `<span class="lab">${SIDENAME[c]} 持駒</span><span class="pc">${items||'<span class="handempty">なし</span>'}</span>`}
function drawBoard(P,o){$('#bd').innerHTML=boardHTML(P,o);
 $('#handTop').innerHTML=handHTML(P,OPP,false,o);$('#handBot').innerHTML=handHTML(P,ME,o.pick,o)}

// ---- 相手の候補手の矢印（右四間飛車と同じ）
const COLORS=['#2f6fd6','#d0402b','#2f9d5a','#b07a12','#8e44ad'];
const LETTER='ABCDE';
const cxy=([f,r])=>ME==='w'?[f-.5,9.5-r]:[9.5-f,r-.5];
let ARW=[];
function layoutArrows(list){const placed=[];
 list.forEach(a=>{const [tx,ty]=cxy(a.to);a.tx=tx;a.ty=ty;const cands=[];
  if(a.from){const [fx,fy]=cxy(a.from);a.fx=fx;a.fy=fy;const dx=tx-fx,dy=ty-fy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
   for(const s of [.55,.3,.8])if(s<L-.1)for(const p of [0,.3,-.3])cands.push([tx-ux*s-uy*p,ty-uy*s+ux*p])}
  for(const [ox,oy] of [[.3,-.3],[-.3,-.3],[.3,.3],[-.3,.3]])cands.push([tx+ox,ty+oy]);
  const c=cands.find(c=>placed.every(q=>Math.hypot(c[0]-q[0],c[1]-q[1])>=.52))||cands[0];
  a.lx=c[0];a.ly=c[1];placed.push(c)});
 return list}
function arrowsSVG(list){ARW=layoutArrows(list);if(!list.length)return '';
 const defs=list.map((a,i)=>`<marker id="ah${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${a.color}"/></marker>`).join('');
 const bodies=list.map((a,i)=>{let body='';
  if(a.from){const dx=a.tx-a.fx,dy=a.ty-a.fy,L=Math.hypot(dx,dy);const ex=a.tx-dx/L*.28,ey=a.ty-dy/L*.28;
   body=`<line class="shaft" x1="${a.fx}" y1="${a.fy}" x2="${ex}" y2="${ey}" stroke="${a.color}" stroke-width=".13" stroke-linecap="round" marker-end="url(#ah${i})"/>`}
  else{body=`<circle cx="${a.tx}" cy="${a.ty}" r=".42" fill="none" stroke="${a.color}" stroke-width=".09" stroke-dasharray=".12 .08"/>
   <text x="${a.tx}" y="${a.ty+.17}" font-size=".42" text-anchor="middle" fill="${a.color}" font-weight="700">${a.drop}</text>`}
  return `<g class="arw" data-i="${i}">${body}</g>`}).join('');
 const labs=list.map((a,i)=>a.label?`<g class="lab" data-i="${i}"><circle cx="${a.lx}" cy="${a.ly}" r=".22" fill="${a.color}" stroke="#fff" stroke-width=".035"/><text x="${a.lx}" y="${a.ly+.09}" font-size=".26" text-anchor="middle" fill="#fff" font-weight="700">${a.label}</text></g>`:'').join('');
 return `<svg class="arrows" viewBox="0 0 9 9" aria-hidden="true"><defs>${defs}</defs>${bodies}${labs}</svg>`}
function segDist(x,y,a){if(!a.from)return Math.max(0,Math.hypot(x-a.tx,y-a.ty)-.42);
 const vx=a.tx-a.fx,vy=a.ty-a.fy;const t=Math.max(0,Math.min(1,((x-a.fx)*vx+(y-a.fy)*vy)/(vx*vx+vy*vy)));
 return Math.hypot(x-a.fx-t*vx,y-a.fy-t*vy)}
function pickAt(x,y){if(!ARW.length)return null;
 const lab=ARW.map((a,i)=>[i,Math.hypot(x-a.lx,y-a.ly)]).filter(p=>p[1]<.3&&ARW[p[0]].label).sort((p,q)=>p[1]-q[1]);
 if(lab.length)return {i:lab[0][0]};
 const dc=Math.floor(x),dr=Math.floor(y);if(dc<0||dc>8||dr<0||dr>8)return null;
 const sq=sqAt(dr,dc);
 const near=ARW.map((a,i)=>[i,a.to[0]===sq[0]&&a.to[1]===sq[1]?0:segDist(x,y,a)]).filter(p=>p[1]<.3).sort((p,q)=>p[1]-q[1]);
 if(!near.length)return null;
 if(near.length===1||near[1][1]-near[0][1]>=.12)return {i:near[0][0]};
 return {amb:near.filter(p=>p[1]-near[0][1]<.12).map(p=>p[0])}}
function hlOnly(arr){const svg=document.querySelector('.arrows');if(!svg)return;
 svg.querySelectorAll('.arw,.lab').forEach(g=>g.classList.toggle('on',arr.includes(+g.dataset.i)));svg.classList.toggle('dim',arr.length>0)}
function bindPick(n,go){const bd=$('#board');
 const pt=ev=>{const r=bd.getBoundingClientRect();return [(ev.clientX-r.left-bd.clientLeft)/bd.clientWidth*9,(ev.clientY-r.top-bd.clientTop)/bd.clientHeight*9]};
 bd.onclick=ev=>{const res=pickAt(...pt(ev));if(!res)return;
  if(res.amb){hlOnly(res.amb);const e=$('#ambnote');if(e)e.textContent=`${res.amb.map(i=>LETTER[i]).join('と')}が重なっています。丸いラベルか下のボタンで選んでください。`;return}
  go(n.ch[res.i].id)};
 bd.onmousemove=ev=>{const res=pickAt(...pt(ev));const one=res&&res.i!=null;hlOnly(one?[res.i]:res&&res.amb?res.amb:[]);bd.style.cursor=one?'pointer':'default'};
 bd.onmouseleave=()=>hlOnly([])}

function tools(list){$('#tools').innerHTML=list.map(([id,lab,dis,,cls])=>`<button class="toolbtn${cls?' '+cls:''}" id="${id}"${dis?' disabled':''}>${lab}</button>`).join('');
 list.forEach(([id,,,fn])=>{$('#'+id).onclick=fn})}

// ---- 上の欄（章・済んだ変化の数・挑戦モード）
let chapHTML='';
function renderMeta(){const h=D.chapters.map(ch=>{const d=progress(ch,ch===C?rec:loadRec(ch));
  return `<option value="${ch.id}"${ch===C?' selected':''}>${esc(ch.name)}（${d}/${ch.nleaf}）</option>`}).join('');
 if(h!==chapHTML){$('#chap').innerHTML=h;chapHTML=h}
 $('#chap').style.display=D.chapters.length>1?'':'none';
 $('#done').textContent=progress(C,rec);$('#nleaf').textContent=C.nleaf;
 const b=$('#examBtn'),u=unlocked();
 b.className='exambtn'+(passed()?' pass':u?' on':'');
 b.textContent=passed()?'挑戦モード 合格':u?'挑戦モード':'挑戦モード（全部すむと開く）';
 b.disabled=!u||mode==='exam'}
$('#chap').onchange=e=>openChapter(e.target.value);
$('#examBtn').onclick=()=>startExam();

const cmtOf=n=>n.c.filter(x=>x!=='基本図');
function cmtHTML(n){const c=cmtOf(n);return c.length?`<div class="cmt">${esc(c.join('\n'))}</div>`:''}
function movesHTML(){const mv=path.slice(1).map((id,i,a)=>`<span class="ply${i===a.length-1?' cur':''}${N[id].w?' w':''}">${N[id].t}</span>`).join('');
 return `<div class="qmeta">手順</div><div class="seq">${mv||'<span class="sub">はじめの局面</span>'}</div>`}
const wazaSoFar=()=>path.slice(1).map(id=>N[id].w).filter(Boolean);
function wazaHTML(){const w=wazaSoFar();return w.length?`<div class="qmeta">でてきた技</div><div class="wz">${w.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
function stat(id){const lv=N[id].lv;return {n:lv.length,k:lv.filter(isDone).length}}
function optHTML(n){return n.ch.map((c,i)=>{const s=stat(c.id);
  const right=s.k>=s.n?'<span class="badge">済</span>':`<small>のこり${s.n-s.k}</small>`;
  return `<button class="opt" data-i="${i}"><span class="lt" style="background:${COLORS[i%COLORS.length]}">${LETTER[i]}</span><span class="mvn">${N[c.id].t}</span>${right}</button>`}).join('')}
function bindOpt(n,go){document.querySelectorAll('#pane .opt').forEach(b=>{const i=+b.dataset.i;b.onclick=()=>go(n.ch[i].id);b.onmouseenter=()=>hlOnly([i]);b.onmouseleave=()=>hlOnly([])})}

function render(){renderMeta();
 const n=cur(),P=parse(n.s);
 const mine=!busy&&myTurn(n)&&n.ch.length>0;
 let hint=null,hintHand=null;if(mine&&hintOn){const c=n.ch[0];if(c.drop)hintHand=c.drop;else hint=c.from.join(',')}
 const last=n.lt?[n.lt.join(','),n.lf?n.lf.join(','):null]:[];
 const branch=mode==='drill'&&!busy&&!myTurn(n)&&n.ch.length>1;
 const arrows=mode==='drill'&&!busy&&!myTurn(n)?n.ch.map((c,i)=>({from:c.from,to:c.to,drop:c.drop?NAME[c.drop]:null,color:COLORS[i%COLORS.length],label:n.ch.length>1?LETTER[i]:''})):[];
 drawBoard(P,{pick:mine,last,hint,hintHand,sel:sel&&sel.k,selHand:sel&&sel.p,arrows});
 if(branch)bindPick(n,pickOpp);
 if(mine){document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>clickSq(c.dataset.k));
  document.querySelectorAll('.hp').forEach(b=>b.onclick=()=>{sel=(sel&&sel.p===b.dataset.p)?null:{p:b.dataset.p};render()})}
 renderPane(n,mine,branch);
 if(mine&&mode==='drill')armHints(n)}

function renderPane(n,mine,branch){
 let m=msg;if(!m&&mine)m=n.ch.length>1?`あなたの番です（棋譜の手が${n.ch.length}通り）。`:'あなたの番です。';
 const tag=mode==='exam'?`<span class="tag">挑戦 ${Math.min(EX.k+1,EXAM_N)}/${EXAM_N}</span>`:'';
 let fin='';
 if(mode==='drill'&&!n.ch.length){const left=C.nleaf-progress(C,rec);
  fin=(left?`<div class="qmeta">のこり ${left} 変化</div>`:'')+`<button class="bigbtn" id="again">${left?'つぎの変化へ（最初から）':'もう一度（最初から）'}</button>`+
   (unlocked()?`<button class="bigbtn ghost" id="toExam">挑戦モードへ</button>`:'')}
 $('#pane').innerHTML=`<div class="situation" id="msg">${tag}${m}</div>`+
  (branch?`<div id="opp"><div class="cdwrap"><b id="cdbar" style="width:${cdLeft/PICK_SEC*100}%"></b></div>${optHTML(n)}<div class="ng" id="ambnote"></div></div>`:'')+
  fin+wazaHTML()+movesHTML()+cmtHTML(n);
 if(branch)bindOpt(n,pickOpp);
 const a=$('#again');if(a)a.onclick=goHome;const e=$('#toExam');if(e)e.onclick=startExam;
 if(mode==='exam')tools([['quit','やめる',false,quitExam]]);
 else tools([['hint','ヒント',!mine,showHint],['undo','1手戻る',busy||!path.slice(0,-1).some(id=>myTurn(N[id])),undo],['home','最初から',false,goHome],
  ['reset',resetArm?'もう一度押すと消します':'記録を消す',false,doReset,'sub']])}

// ---- 自分の手
function clickSq(k){if(busy)return;const n=cur();const P=parse(n.s);const [f,r]=k.split(',').map(Number);const pc=at(P,f,r);
 if(sel&&sel.p){tryMove({drop:sel.p,to:[f,r]});return}
 if(!sel){if(pc&&pc.c===ME){sel={k};render()}return}
 if(k===sel.k){sel=null;render();return}
 if(pc&&pc.c===ME){sel={k};render();return}
 tryMove({from:sel.k.split(',').map(Number),to:[f,r]})}
const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
function tryMove(mv){const n=cur();
 const hits=n.ch.filter(c=>same(c.to,mv.to)&&(mv.drop?c.drop===mv.drop:(!c.drop&&same(c.from,mv.from))));
 sel=null;
 if(!hits.length){wrong();return}
 if(hits.some(c=>c.promoOpt)){pending=hits;$('#promo').style.display='flex';return}
 correct(hits[0])}
function choosePromo(yes){$('#promo').style.display='none';const hits=pending;pending=null;if(!hits)return;
 const c=hits.find(x=>x.promote===yes);if(c)correct(c);else wrong(yes?'この手は成りません。':'この手は成ります。')}
$('#pyes').onclick=()=>choosePromo(true);$('#pno').onclick=()=>choosePromo(false);

function shake(){const b=$('#board');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
function wrong(why){sNg();
 if(mode==='exam'){examFail();return}
 miss++;if(miss>=2&&!hintOn){hintOn=true;usedHint=true}
 msg=`<span class="ng">棋譜にない手です。</span>${why||''}${hintOn?'光っている駒を動かしてください。':''}`;
 render();shake()}
function correct(c){miss=0;hintOn=false;clearHints();
 const w=N[c.id].w;
 if(!w){sClick();msg=`<span class="ok">○ ${N[c.id].t}</span>`;advance(c.id);return}
 // 技の手: 駒が光って技名が出る → 大きな演出 → 終わってから相手が指す
 stopTimers();path.push(c.id);sel=null;busy=true;
 msg=`<span class="ok">○ ${N[c.id].t}</span>　<span class="wzname">技: ${esc(w)}</span>`;
 render();sClick();sOk();glowAt(c.to);popAt(c.to,w);bigFlash(w);
 timer=later(FLASH_MS,()=>{busy=false;arrive()})}
function cellEl(sq){return document.querySelector(`.cell[data-k="${sq[0]},${sq[1]}"]`)}
function glowAt(sq){const el=cellEl(sq);if(el){el.classList.add('glow');setTimeout(()=>el.classList.remove('glow'),1000)}}
function popAt(sq,text){const el=cellEl(sq),wrap=document.querySelector('.boardwrap');if(!el)return;
 const wr=wrap.getBoundingClientRect(),r=el.getBoundingClientRect(),up=r.top-wr.top>r.height*2;
 const p=document.createElement('div');p.className='pop'+(up?' up':'');p.textContent=text;
 p.style.left=(r.left-wr.left+r.width/2)+'px';p.style.top=(up?r.top-wr.top-2:r.bottom-wr.top+2)+'px';
 wrap.appendChild(p);setTimeout(()=>p.remove(),1500)}
function bigFlash(w){flashN++;if(FAST)return;$('#flashTag').textContent=w;const f=$('#flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}

// ---- 進行
let cd=null,cdLeft=PICK_SEC,resetArm=null;
function stopTimers(){clearTimeout(timer);clearInterval(cd);cd=null}
function advance(id){stopTimers();path.push(id);sel=null;arrive()}
function pickOpp(id){stopTimers();sClick();msg='';advance(id)}
// 相手の分岐を自動で選ぶ。まだ済んでいない（挑戦では、まだ出ていない）変化を優先する
function autoPick(n){const fresh=n.ch.filter(c=>N[c.id].lv.some(l=>mode==='exam'?!EX.used.has(l):!isDone(l)));
 const pool=fresh.length?fresh:n.ch;return pool[Math.floor(Math.random()*pool.length)]}
function arrive(){const n=cur();
 if(n.ch.length===0){finish();return}
 if(myTurn(n)){render();return}
 if(mode==='exam'||n.ch.length===1){const c=mode==='exam'?autoPick(n):n.ch[0];
  msg=(msg?msg+'<br>':'')+`相手：<b>${N[c.id].t}</b>`;render();
  timer=later(AUTO_MS,()=>{sClick();msg='';advance(c.id)})}
 else{cdLeft=PICK_SEC;msg=(msg?msg+'<br>':'')+`相手の手を選んでください。<small>（<b id="cdn">${PICK_SEC}</b>秒で自動）</small>`;render();
  cd=setInterval(()=>{cdLeft--;const e=$('#cdn');if(e)e.textContent=cdLeft;const b=$('#cdbar');if(b)b.style.width=(cdLeft/PICK_SEC*100)+'%';
   if(cdLeft<=0){const c=autoPick(n);sClick();msg=`相手は <b>${N[c.id].t}</b>`;advance(c.id)}},1000)}}

function finish(){const n=cur(),l=n.leaf;
 if(mode==='exam'){EX.used.add(l);EX.k++;
  if(EX.k>=EXAM_N){examPass();return}
  sDone();msg=`<span class="ok">${EX.k}回目 クリア！</span> つぎへ進みます。`;render();
  timer=later(1500,()=>{path=[C.start];msg='';sel=null;arrive()});return}
 const before=unlocked();
 if(l!=null){const k=C.lkeys[l],prev=rec[k];if(!usedHint)rec[k]='clean';else if(prev!=='clean')rec[k]='hint';saveRec()}
 sFan();
 msg=`<span class="ok">この変化は完了です！</span>`+(usedHint?'<br><small>ヒントを使ったので「ヒントあり」で記録しました。</small>':'')+
  (!before&&unlocked()?'<br><b>全部の変化が済みました。挑戦モードが開きました！</b>':'');
 render()}

// ---- ヒント（自分の番で10秒: 技名、20秒: 動かす駒が光る。2回間違えても光る）
function clearHints(){hintT.forEach(clearTimeout);hintT=[];hintNode=null}
function armHints(n){const id=path[path.length-1];if(hintNode===id)return;clearHints();hintNode=id;
 const wc=n.ch.find(c=>N[c.id].w);
 if(wc)hintT.push(idle(HINT1,()=>{if(cur()!==n||busy)return;usedHint=true;msg=`技名ヒント: <span class="wzname">${esc(N[wc.id].w)}</span> を使う手です。`;render()}));
 hintT.push(idle(HINT2,()=>{if(cur()!==n||busy)return;hintOn=true;usedHint=true;msg='光っている駒を動かしてください。';render()}))}
function showHint(){hintOn=true;usedHint=true;msg='光っている駒を動かしてください。';render()}
function undo(){stopTimers();clearHints();if(path.length<=1)return;path.pop();while(path.length>1&&!myTurn(cur()))path.pop();
 sel=null;miss=0;hintOn=false;busy=false;msg='1手戻しました。';if(myTurn(cur()))render();else arrive()}
function reset0(){stopTimers();clearHints();path=[C.start];sel=null;miss=0;hintOn=false;usedHint=false;busy=false;msg='';pending=null;$('#promo').style.display='none'}
function goHome(){mode='drill';EX=null;reset0();arrive()}
function doReset(){if(!resetArm){resetArm=setTimeout(()=>{resetArm=null;if(mode==='drill')render()},4000);render();return}
 clearTimeout(resetArm);resetArm=null;rec={};saveRec();lsDel(examKey(C));msg='この章の学習記録を消しました。';render()}
function setChapter(id){C=D.chapters.find(c=>c.id===id)||D.chapters[0];N=C.nodes;ME=C.side;OPP=ME==='b'?'w':'b';rec=loadRec(C);
 lsSet(PFX+'last',C.id);if(!SELFTEST)try{history.replaceState(null,'','#'+C.id)}catch(e){}}
function openChapter(id){setChapter(id);goHome()}

// ---- 挑戦: 最初から3回つづけて指す。相手はまだ出ていない変化を選ぶ。ヒントなし、1回でも間違えたら不合格
function startExam(){if(!unlocked())return;hideResult();mode='exam';EX={k:0,used:new Set()};reset0();
 msg='挑戦モード: ヒントなしで3回つづけて最後まで指します。';arrive()}
function quitExam(){hideResult();goHome()}
function showResult(mark,title,text,b1,f1,b2,f2){$('#resMark').textContent=mark;$('#resTitle').textContent=title;$('#resText').textContent=text;
 $('#res1').textContent=b1;$('#res1').onclick=f1;$('#res2').textContent=b2;$('#res2').onclick=f2;$('#result').classList.add('show')}
function hideResult(){$('#result').classList.remove('show')}
function examPass(){stopTimers();busy=true;lsSet(examKey(C),'1');sFan();render();
 showResult('◎','合格！',`${EXAM_N}回とも最後まで棋譜どおりに指せました。`,'もう一度挑戦',startExam,'練習にもどる',quitExam)}
function examFail(){stopTimers();busy=true;render();shake();
 showResult('×','不合格',`${EX.k+1}回目で棋譜にない手を指しました。`,'もう一度挑戦',startExam,'練習にもどる',quitExam)}

// ---- 盤の大きさ（右四間飛車と同じ計算）
function sizeBoard(){
 const vv=window.visualViewport;
 const w=(vv&&vv.width)||window.innerWidth;
 const h=(vv&&vv.height)||window.innerHeight;
 const twoCol=w>820;
 const availH=(twoCol?h:h*0.60)-120;
 const byH=availH/9.23;
 const availW=(twoCol?w*0.50:w*0.96)-120;
 const byW=availW/9.7;
 const cell=Math.max(22,Math.min(80,Math.floor(Math.min(byH,byW))));
 document.documentElement.style.setProperty("--cell",cell+"px");
 document.documentElement.style.setProperty("--bw",(cell*10)+"px");
}

// ---- セルフテスト（?selftest）: 全変化をタップ入力で指し通し、技名・記録・挑戦の合否を確かめる
const sqK=u=>(+u[0])+','+('abcdefghi'.indexOf(u[1])+1);
function tapMove(u){if(u[1]==='*'){sel={p:u[0]};clickSq(sqK(u.slice(2,4)))}
 else{clickSq(sqK(u.slice(0,2)));clickSq(sqK(u.slice(2,4)));if($('#promo').style.display==='flex')choosePromo(u.endsWith('+'))}}
function selftest(){const out=[];let bad=0;const T=(c,m)=>{if(!c){bad++;out.push('NG '+m)}};
 D.chapters.forEach(ch=>{
  lsDel(PFX+ch.id);lsDel(PFX+'exam:'+ch.id);openChapter(ch.id);
  T(!unlocked(),ch.id+' 最初から挑戦が開いている');
  // 1) 全変化を指し通す（自分の手はタップ、相手の分岐はボタンで選ぶ）
  for(let l=0;l<C.nleaf;l++){goHome();const seq=C.lkeys[l].split(' ');const f0=flashN;let g=0;
   while(cur().ch.length&&g++<300){const n=cur(),u=seq[path.length-1];
    if(myTurn(n))tapMove(u);else{const c=n.ch.find(x=>x.usi===u);if(!c){T(false,`${ch.id} 変化${l+1} 相手の手 ${u} がない`);break}pickOpp(c.id)}
    if(path.length-1>seq.length)break}
   T(path.length-1===seq.length&&cur().leaf===l,`${ch.id} 変化${l+1} を最後まで指せない（${path.length-1}/${seq.length}手）`);
   T(rec[C.lkeys[l]]==='clean',`${ch.id} 変化${l+1} が clean で記録されない`);
   const want=path.slice(1).filter(id=>N[id].w).length;
   T(flashN-f0===want,`${ch.id} 変化${l+1} 技名の演出 ${flashN-f0} 回（本来 ${want}）`);
   T(l===C.nleaf-1||!unlocked(),`${ch.id} 変化${l+1} の時点で挑戦が開いている`)}
  T(unlocked(),ch.id+' 全変化のあと挑戦が開かない');
  // 2) 誤答: 局面そのまま、2回でヒント
  goHome();const n0=cur();let wm=null;
  const P=parse(n0.s);
  for(let f=1;f<=9&&!wm;f++)for(let r=1;r<=9&&!wm;r++){const pc=at(P,f,r);if(pc&&pc.c===ME&&pc.p==='P'){const to=[f,ME==='b'?r-1:r+1];
   if(!n0.ch.some(c=>same(c.from,[f,r])&&same(c.to,to)))wm={from:[f,r],to}}}
  tryMove(wm);T(path.length===1&&miss===1&&!hintOn,ch.id+' 1回目の誤答');
  tryMove(wm);T(path.length===1&&hintOn&&usedHint,ch.id+' 2回目の誤答でヒントが出ない');
  // 3) 1手戻る
  goHome();tapMove(C.lkeys[0].split(' ')[0]);const pl=path.length;undo();
  T(pl>=2&&path.length===1&&myTurn(cur()),ch.id+' 1手戻るで最初に戻らない');
  // 4) 挑戦: 3回指し通して合格（3回とも違う変化）
  startExam();let g=0;
  while(mode==='exam'&&!$('#result').classList.contains('show')&&g++<1000){const n=cur();if(!myTurn(n)||busy||!n.ch.length)break;const fc=n.ch.find(c=>N[c.id].lv.some(l=>!EX.used.has(l)))||n.ch[0];tapMove(fc.usi)}
  T($('#result').classList.contains('show')&&$('#resTitle').textContent==='合格！',ch.id+' 挑戦で合格にならない');
  T(EX&&EX.used.size===EXAM_N,ch.id+' 挑戦の変化が重なった');
  T(passed(),ch.id+' 合格が記録されない');
  // 5) 挑戦で誤答 → 不合格
  startExam();tryMove(wm);
  T($('#result').classList.contains('show')&&$('#resTitle').textContent==='不合格',ch.id+' 挑戦の誤答で不合格にならない');
  hideResult();lsDel(PFX+ch.id);lsDel(PFX+'exam:'+ch.id);
  out.push(`${ch.id}: 変化${ch.nleaf}本・技名${ch.nodes.filter(x=>x.w).length}手`)});
 lsDel(PFX+'last');
 const pre=document.createElement('pre');pre.id='selftest';
 pre.textContent=(bad?'SELFTEST NG '+bad:'SELFTEST OK '+D.chapters.length)+'\n'+out.join('\n');
 document.body.setAttribute('data-selftest',bad?'NG':'OK');document.body.appendChild(pre)}

const h0=(location.hash||'').slice(1);
openChapter(D.chapters.some(c=>c.id===h0)?h0:(lsGet(PFX+'last')||D.chapters[0].id));

// 画面確認用 ?demo=変化番号:手数 （例 ?demo=1:22 → 変化1を22手目まで早送りし、23手目を普通に指す）
const dm=/[?&]demo=(\d+):(\d+)/.exec(location.search);
if(dm&&!SELFTEST){const seq=C.lkeys[+dm[1]-1].split(' '),upto=+dm[2];FAST=true;let g=0;
 while(path.length-1<upto&&cur().ch.length&&g++<300){const n=cur(),u=seq[path.length-1];if(myTurn(n))tapMove(u);else pickOpp(n.ch.find(x=>x.usi===u).id)}
 FAST=false;stopTimers();clearHints();render();const u=seq[path.length-1];if(u&&myTurn(cur()))setTimeout(()=>tapMove(u),300)}
